<!-- MOCK（ux，2026-10-26）：在原型 v2 上加「一个买点由哪几个框构成」与「pattern 层的变体」。只改分组 / 拓扑相关部分，其余照抄原型。
     改动：bracket 轨在标注模式常驻、画每个买点的派生范围（虚线）；选中买点时成员加粗、非成员变淡；买点 edit 栏 members / others 两排可点的名称块；
     summary 按当前 pattern 加 定义 / variants / in 列。用完即扔。
     以下为原型 v2 原注释：

     按 2026-10-25 用户拍板的方向重写：标注时只看干净 K 线、不能点选系统事件；名称和属性用用户自己的词、存成可复用词表；
     角色不手填；对照不给数字、同轨叠画；对照开关换图自动关；汇总页按名称列对应表、新老分开。

     数据来自 scripts/01-dump-proto-data.py（只读截到 2025-12-31 的副本）。状态只在内存里，刷新即丢。 -->
<style>

  :root { --bad: #D55E00; }   /* 朱红：用户色板里唯一和主视图现用色都分得开的颜色 */
  .tag.bad { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 700; }   /* 朱红底白字 = 违背预期（app 漏买 / 误买、没认出、没连上） */
  /* 来源底色：会话翻译出来的 = 中蓝（冷），app 跑出来的 = 浅琥珀（暖）；用户自己的和界面从它算出来的不加底色。
     中蓝必须比用户自然语言的浅灰底（#e9e9ec，明度约 92）暗一档：原先的浅蓝 #dbeafe 明度约 92，用户实测和浅灰分不开（2026-10-26）；现 #93c5fd 明度约 78 */
  :root { --st-session: #93c5fd; --st-app: #fdecc0; }

  .sym[title], .tag[title], .k[title], .legend [title] { cursor: help; }   /* 有悬停解释的程序文字 */

  .arr { font-family: var(--mono); font-size: 11px; color: var(--sym); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; padding-top: 2px; }

<body>
<div id="top"></div>
<div id="wrap"><div id="chartcol"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div><aside id="side"></aside></div>
<script src="data.js"></script>
<script>
'use strict'
const D = window.PROTO_DATA
const SPEC = D.pattern_spec
const APP = SPEC.pattern_id                       // bb_v1
// 配色照搬主视图：node 本色来自 app 声明的 event_styles；进了 match 用本色，过了 where 深灰，只检测到浅灰；K 线绿涨红跌
const NODE_COLOR = SPEC.event_styles
const TIER_QUAL = '#9ca3af', TIER_DET = '#d1d5db', NEUTRAL = '#888888'
const UP = '#47b262', DOWN = '#eb5454'
const WHERE = {}
for (const n of SPEC.topology.nodes) WHERE[n.node_id] = n.where_rules
const APP_NODES = ['burst', 'tb']                 // view 模式的副图轨（bo 画在主图上，pk 不画）
const MONO = 'ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace'
const SANS = 'system-ui, sans-serif'

// 对应表：真实流程里由会话在标完后按跨图证据写；原型里预先写好一份示意，按词的字面对
// res 是界面上「由谁来认」的唯一写法，用代码标识符：app 里的写 node 名，没接进 app 的写事件类名（加关键字段）；不设代码 → 中文名的对照表
// doc 是悬停内容 = 该事件类说明的第一行。正式版两者都在运行时从 app 声明和类定义读，这里是照抄的示意
const MAP = {                                     // 名称 → app 里由谁来认
  '放量突破': { res: 'node:burst', node: 'burst', doc: 'BurstEvent：一串 bo 聚合成的密度 burst。' },
  '回踩': { res: 'node:tb', node: 'tb', doc: 'ThrowbackEventV1：突破后可执行整理买窗事件(首段即停)。' },
  '横盘': { res: 'TrendSegment:sideways', atom: 'trend', regime: 'sideways', doc: 'TrendSegment：走势-无关的连续相同 regime 区段。' },
  '平台': { res: 'Platform', atom: 'platform', doc: 'Platform：窄幅震荡平台段。' },
}
const DMAP = {                                    // 属性 → where
  '放量': { node: 'burst', clause: 'vol_spike' },
  '突破过好几个峰': { node: 'burst', clause: 'distinct_pk' },
  '突破前沉寂够久': { node: 'burst', clause: 'first_drought' },
  '回踩里没有大跌': { node: 'tb', clause: 'day_drop' },
}
// 待验证的默认值
const TOL = 2           // app 事件的起点或终点落在框外几天以内，仍算同一件事
const BUY_TOL = 3       // label=buy：app 买点在前后几天以内（或落在回踩事件里）算 app 也买
const NOBUY_TOL = 1     // label=no_buy：app 买点在前后几天以内算 app 买了
const CHANCE_WARN = 0.3 // 随手一框也被判 qualified 的比例超过它，就标 chance_high

// ── 状态（只在内存里） ──
const S = {
  stock: 0, mode: 'annotate', cmp: false, tool: 'select', tab: 'edit',
  cur: APP, patterns: [APP, '未归类'],
  words: [], ann: {}, sel: null, drag: null, seq: 1, renaming: false, flags: [],
  ov: {}, pdef: {}, hover: null,   // ov：买点 → {框 → 进 / 出}，只记用户改过的；pdef：pattern 定义
}

// ── 数据整理 ──
const STOCKS = D.stocks.map(st => {
  const byId = {}
  const matchedIds = new Set()
  for (const m of st.analysis.matches) for (const id of Object.values(m.node_index)) matchedIds.add(id)
  const sys = []
  for (const e of st.analysis.events) {
    if (e.node_id === 'pk') continue
    const it = { id: e.instance_id, node: e.node_id, s: e.start_idx, e: e.end_idx, f: e, matched: matchedIds.has(e.instance_id) }
    sys.push(it); byId[it.id] = it
  }
  for (const e of st.analysis.events) if (e.node_id === 'burst' && matchedIds.has(e.instance_id))
    for (const b of (e.child_refs.members || [])) if (byId[b]) byId[b].matched = true
  for (const a of st.atoms) {
    const it = { id: a.instance_id, node: null, atom: a.kind, regime: a.regime, s: a.start_idx, e: a.end_idx, f: a,
                 label: a.kind === 'platform' ? 'platform' : a.regime }
    sys.push(it); byId[it.id] = it
  }
  const matches = st.analysis.matches.map((m, i) => ({ no: i + 1, s: m.start_idx, e: m.end_idx, buy: byId[m.node_index.tb].s,
                                                      tb: byId[m.node_index.tb], nodes: m.node_index }))
  return { symbol: st.symbol, bars: st.bars, sys, byId, matches }
})
const ST = () => STOCKS[S.stock]
const annOf = st => (S.ann[st.symbol] ||= { boxes: [], buys: [] })
const A = () => annOf(ST())
const isApp = p => p === APP
const nid = p => p + (S.seq++)
const W = id => S.words.find(w => w.id === id)
const txt = id => (W(id) || {}).text || ''
const dateOf = (st, i) => st.bars[Math.max(0, Math.min(st.bars.length - 1, i))].date
const date = i => dateOf(ST(), i)
const span = (st, b) => dateOf(st, b.s) + (b.e > b.s ? ' → ' + dateOf(st, b.e) : '')
function wordOf(text) {             // 用户的词：有就用，没有就新建；同一份词表跨图、跨 pattern 共用
  let w = S.words.find(x => x.text === text)
  if (!w) { w = { id: nid('w'), text, def: '' }; S.words.push(w) }
  return w.id
}
const evalWhere = (node, se) => (WHERE[node] || []).map(r => {
  const v = se.f[r.field]
  const ok = v != null && ({ '>=': v >= r.threshold, '>': v > r.threshold, '<': v < r.threshold, '<=': v <= r.threshold })[r.op]
  return { id: r.clause_id, ok: !!ok }
})
const qualified = se => !se.node || evalWhere(se.node, se).every(r => r.ok)

// ── 属性的三种状态：true / false / null（null = 标这个框时这条属性还不存在） ──
function attrsOf(nameId) {          // 所有图上、同名的框用过的属性（按首次出现顺序）
  const out = []
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId)
    for (const w of Object.keys(b.attrs)) if (!out.includes(w)) out.push(w)
  return out
}
const attrState = (b, w) => b.attrs[w] === true ? 'true' : b.attrs[w] === false ? 'false' : 'null'
function setName(b, id) {           // 选了名称，以前和它一起用过的属性默认全为 true
  b.name = id
  for (const w of attrsOf(id)) if (!(w in b.attrs)) b.attrs[w] = true
}
function parentOf(b, a) {           // 框套框：时间上被另一个框包住，默认算属于它；用户点掉「⊂」（detach）的不算
  if (b.detach) return null
  let p = null
  for (const o of a.boxes) if (o !== b && o.s <= b.s && o.e >= b.e && (o.e - o.s) > (b.e - b.s))
    if (!p || (o.e - o.s) < (p.e - p.s)) p = o
  return p
}

// ── 一个买点由哪几个框构成（成员）：默认规则 + 用户改过的那几个框；范围由成员派生，不单独存 ──
const GAP = 20          // 待验证：从买点往前，前后两段之间空几根 K 线以内仍算连着（买点到第一个框、框到框用同一个数）
function autoMembers(bp, st) {
  const bs = annOf(st).boxes.filter(b => b.s <= bp.idx)          // 买点之后才开始的框不可能是买入理由
  const mem = new Set()
  let edge = bp.idx, changed = true
  while (changed) {
    changed = false
    for (const b of bs) if (!mem.has(b) && b.e >= edge - GAP) { mem.add(b); changed = true }   // 落在这串跨度里的框也算接上（原先漏了 b.s > edge 的这类）
    if (mem.size) edge = Math.min(...[...mem].map(b => b.s))
  }
  for (const b of bs) if (!mem.has(b) && [...mem].some(m => m.s <= b.s && m.e >= b.e)) mem.add(b)   // 被成员包住的跟着进；detach 只管「属不属于外框」，不管是不是成员
  return mem
}
function membersOf(bp, st) {
  const m = autoMembers(bp, st), ov = S.ov[bp.id] || {}
  for (const b of annOf(st).boxes) if (b.id in ov) { if (ov[b.id]) m.add(b); else m.delete(b) }
  return [...m].sort((p, q) => p.s - q.s || q.e - p.e)
}
const edited = bp => Object.keys(S.ov[bp.id] || {}).length > 0
function rangeOf(bp, st) {
  const ms = membersOf(bp, st)
  return { s: Math.min(bp.idx, ...ms.map(b => b.s)), e: Math.max(bp.idx, ...ms.map(b => b.e)), ms }
}
function treeOf(ms) {               // 成员按先后排；被别的成员包住的挂在它下面
  const par = new Map()
  for (const b of ms) {
    let p = null
    if (!b.detach) for (const o of ms) if (o !== b && o.s <= b.s && o.e >= b.e && (o.e - o.s) > (b.e - b.s)) if (!p || (o.e - o.s) < (p.e - p.s)) p = o
    par.set(b, p)
  }
  const top = ms.filter(b => !par.get(b))
  return top.map(t => ({ b: t, kids: ms.filter(k => par.get(k) === t) }))
}
const sigOf = (bp, st) => treeOf(membersOf(bp, st)).map(n => txt(n.b.name)).join(' → ') || '∅'   // 骨架 = 顶层成员的名称按先后排；子框、属性不进

// ── 对照：框 qualified / detected / missing，买点 app=buy / no_buy，两框之间 link，不出数字 ──
function candidates(b, st) {
  const m = MAP[txt(b.name)]
  if (!m) return null
  const near = x => x >= b.s - TOL && x <= b.e + TOL
  return st.sys.filter(se => (m.node ? se.node === m.node : se.atom === m.atom && (!m.regime || se.regime === m.regime))
                             && se.e >= b.s - TOL && se.s <= b.e + TOL && (near(se.s) || near(se.e)))
}
function verdict(b, st) {
  if (b.letGo) return { st: 'let_go', checks: [], flags: [] }
  const c = candidates(b, st)
  if (!c) return { st: 'unmapped', checks: [], flags: [] }
  const m = MAP[txt(b.name)]
  const flags = m.atom ? ['default_params'] : []
  if (!c.length) return { st: 'missing', res: m.res, checks: [], flags }
  const ov = x => Math.min(x.e, b.e) - Math.max(x.s, b.s)
  const better = (x, p) => x.matched !== p.matched ? x.matched : ov(x) > ov(p)   // 进了 match 的优先，其次交叠多的
  const pick = arr => arr.reduce((p, x) => better(x, p) ? x : p)
  const q = c.filter(qualified)
  const ev = q.length ? pick(q) : pick(c)
  const checks = []                 // 每条：属性（或无对应属性的 where）、用户怎么标、app 过没过
  for (const r of (ev.node ? evalWhere(ev.node, ev) : [])) {
    const w = S.words.find(x => DMAP[x.text] && DMAP[x.text].node === ev.node && DMAP[x.text].clause === r.id)
    const user = w ? (w.id in b.attrs || attrsOf(b.name).includes(w.id) ? attrState(b, w.id) : '—') : '—'
    const app = r.ok ? 'pass' : 'fail'
    if (r.ok && user !== 'false') continue   // 只列对不上的：app 没过，或用户说 false 而 app 说 pass
    checks.push({ attr: w ? w.text : null, clause: r.id, user, app })
  }
  for (const w of Object.keys(b.attrs)) if (b.attrs[w] && !DMAP[txt(w)]) checks.push({ attr: txt(w), clause: null, user: 'true', app: 'n/a' })
  return { st: q.length ? 'qualified' : 'detected', res: m.res, checks, flags, ev }
}
function buyVerdict(bp, st) {
  if (!isApp(bp.pattern)) return { app: 'n/a', link: '—', pending: [] }
  if (bp.label === 'no_buy') {
    const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= NOBUY_TOL)
    return { app: m ? 'buy' : 'no_buy', link: '—', pending: [] }
  }
  const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= BUY_TOL || (bp.idx >= x.tb.s && bp.idx <= x.tb.e))
  const top = treeOf(membersOf(bp, st)).map(n => n.b)
  const links = top.slice(1).map((b, i) => pairLink(top[i], b, st))
  const link = links.includes('broken') ? 'broken' : links.includes('pending') ? 'pending' : links.includes('ok') ? 'ok' : '—'
  return { app: m ? 'buy' : 'no_buy', link, links, pending: [] }
}
function pairLink(a, b, st) {        // 两框之间：都认出了，且 app 有一个 match 同时绑了这两处 → ok
  const ma = MAP[txt(a.name)], mb = MAP[txt(b.name)]
  if (!ma || !mb || !ma.node || !mb.node) return '—'                  // 有一边不是这个 app 的 node（如走势区段），没有边可查
  const qa = (candidates(a, st) || []).filter(qualified), qb = (candidates(b, st) || []).filter(qualified)
  if (!qa.length || !qb.length) return 'pending'
  return st.matches.some(m => { const ids = Object.values(m.nodes); return qa.some(x => ids.includes(x.id)) && qb.some(x => ids.includes(x.id)) }) ? 'ok' : 'broken'
}
function seeded(seed) { let r = seed % 2147483646 + 1; return () => (r = (r * 16807) % 2147483647) / 2147483647 }
function chanceOf(nameId) {         // 底：同样宽的框随便挪个位置，被判 qualified 的比例
  let hit = 0, tot = 0
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId && !b.letGo && MAP[txt(nameId)]) {

function idxAt(evt) {

}

  h += `<div class="hdr">${sym('elements', '这个 pattern 的买点成员里出现过的名称，按先后从上到下排')} ${sym('n=' + N, `这个 pattern 一共 ${N} 个买点（所有图）`)}<span class="grow"></span></div>`
  tops.forEach((id, i) => {
    if (i) h += `<div class="arr" style="flex-direction:row;gap:6px;margin:1px 0 1px 10px"><span title="上下两行的先后">↓</span> ${linkAgg(tops[i - 1], id)}</div>`
    h += elem(id, false)
    for (const k of [...kidName].filter(k => !topName.has(k) && inst.some(x => treeOf(x.ms).some(n => n.b.name === id && n.kids.some(c => c.name === k))))) h += elem(k, true)
  })
  // 分组：按骨架（顶层成员名称序列）完全相同归组；每组一个「→ pattern」
  const groups = {}
  for (const x of inst) (groups[x.sig] ||= []).push(x)
  const vs = Object.entries(groups).sort((p, q) => q[1].length - p[1].length)
  h += `<div class="hdr">${sym('groups', '按顶层成员顺序完全相同，把这个 pattern 的买点分组；套在里面的框不算')} ${sym('n=' + vs.length, `${vs.length} 组`)}</div>`
  for (const [sig, xs] of vs) {
    const chain = treeOf(xs[0].ms).map((n, i) => (i ? arrow(null) : '') + roChip(n.b)).join('') || sym('∅')
    const nb = xs.filter(x => x.bp.label === 'buy').length, nn = xs.length - nb
    const ab = lb => xs.filter(x => x.bp.label === lb && buyVerdict(x.bp, x.st).app === 'buy').length
    const part = (lb, n) => !n ? '' : sym(`${lb} ${n}`, lb === 'buy' ? `其中 ${n} 个你标 buy（该买）` : `其中 ${n} 个你标 no_buy（像但不该买）`) + (app ? seg('app', tag('app:buy ' + ab(lb) + '/' + n, (lb === 'buy' ? ab(lb) < n : ab(lb) > 0) ? 'bad' : '',
      lb === 'buy' ? `这 ${n} 个 buy，app 买了 ${ab(lb)} 个${ab(lb) < n ? `，漏买 ${n - ab(lb)} 个` : ''}` : `这 ${n} 个 no_buy，app 买了 ${ab(lb)} 个${ab(lb) > 0 ? `，误买 ${ab(lb)} 个` : ''}`)) : '')   // buy 看 app 漏了几个，no_buy 看 app 误买几个，有问题的反白
    h += `<div class="vrow"><div class="chain">${chain}</div><div class="meta">${sym('×' + xs.length, `这组 ${xs.length} 个买点`)} ${part('buy', nb)} ${part('no_buy', nn)}<span class="grow"></span>
          <select data-act="vmove:${esc(sig)}" class="sym" title="把整组挪到别的 pattern；只改归类，不切页"><option value="">→ pattern</option>${S.patterns.filter(p => p !== S.cur).map(p => `<option>${esc(p)}</option>`).join('')}<option value="__new">+ new</option></select></div>
          <div class="meta">${xs.map(x => thumb(x)).join('')}</div></div>`
  }
  return h
}
const resName = m => m ? m.res : 'unmapped'       // 和 edit 栏 resolver 一格同一写法（代码标识符）
// 缩略：这个买点附近那段时间的名称轨缩小版。每个出现的名字一行、行首是它的名称块，行序同主图名称轨；
// 成员黑色实线、非成员浅灰；买点三角实心 buy / 空心 no_buy；不画 K 线，股票和日期放悬停；点了跳到那张图
function thumb(x) {
  const r = rangeOf(x.bp, x.st), s0 = Math.max(0, r.s - 25), s1 = Math.min(x.st.bars.length - 1, r.e + 4)
  const bx = annOf(x.st).boxes.filter(b => b.e >= s0 && b.s <= s1)
  const rk = rankOf(x.bp.pattern), key = id => id in rk ? rk[id] : 2
  const names = [...new Set(bx.map(b => b.name))].sort((p, q) => key(p) - key(q))
  const LBW = 54, W = 168, RH = 11, k = (W - LBW - 4) / (s1 - s0 + 1), X = i => LBW + (i - s0) * k
  const ms = new Set(r.ms), H = names.length * RH + 12
  let g = names.map((n, i) => `<rect x="0" y="${i * RH + 1}" width="${LBW - 4}" height="${RH - 2}" rx="1.5" fill="#e9e9ec"/><text x="2" y="${i * RH + 8.5}" font-size="8.5" font-family="system-ui,sans-serif" fill="#111">${esc(txt(n))}</text>`).join('')
  for (const b of bx) {
    const i = names.indexOf(b.name), mem = ms.has(b)
    g += `<rect x="${X(Math.max(b.s, s0))}" y="${i * RH + 1.5}" width="${Math.max(2, (Math.min(b.e, s1) - Math.max(b.s, s0) + 1) * k)}" height="${RH - 3}" fill="none" stroke="${mem ? '#111' : '#bbb'}" stroke-width="${mem ? 1.4 : 1}"/>`
  }
  const bxp = X(x.bp.idx) + k / 2, yb = names.length * RH + 2
  g += `<path d="M${bxp} ${yb} L${bxp - 4} ${yb + 8} L${bxp + 4} ${yb + 8} Z" fill="${x.bp.label === 'buy' ? '#111' : '#fff'}" stroke="#111"/>`
  const cur = S.stock === x.si && S.sel && S.sel.type === 'buy' && S.sel.id === x.bp.id   // 主图上正打开的那个买点：缩略图加黑框
  return `<svg width="${W}" height="${H}" style="border:1px solid #e4e4e7;border-radius:3px;cursor:pointer;background:#fff;${cur ? 'outline:2px solid #111;outline-offset:1px' : ''}" data-act="goto:${x.si}:${x.bp.id}"><title>${esc(x.st.symbol)} ${dateOf(x.st, x.bp.idx)} ${x.bp.label} · 点一下在主图打开</title><g pointer-events="none">${g}</g></svg>`
}
const roChip = b => `<span class="chip ro" data-hover="${b.id}">${esc(txt(b.name) || 'unnamed')}</span>`
function sideJson() {
  const B = batch()
  return `<div class="hdr">${sym('json', '存下来的原始记录')} ${sym(B.file, '文件名')}</div><pre>${esc(JSON.stringify(B, null, 1))}</pre>`
}
function batch() {
  const charts = []
  for (const st of STOCKS) {
    const a = annOf(st); if (!a.boxes.length && !a.buys.length) continue
    const d = i => st.bars[i].date
    charts.push({
      symbol: st.symbol,
      boxes: a.boxes.map(b => ({ id: b.id, name: b.name, start: d(b.s), end: d(b.e),
        ...(Object.keys(b.attrs).length ? { attrs: b.attrs } : {}),
        ...(b.note ? { note: b.note } : {}), ...(b.letGo ? { let_go: true } : {}), ...(b.detach ? { detach: true } : {}) })),
      buy_points: a.buys.map(b => ({ date: d(b.idx), pattern: b.pattern, label: b.label, members: membersOf(b, st).map(x => x.id),
        ...(edited(b) ? { members_edited: true } : {}), ...(b.note ? { note: b.note } : {}) })),
    })
  }
  return {
    file: 'annotations/20261025-140311_upc.json', machine: 'upc', data_fingerprint: 'pkls_until_20251231 @ ' + D.snapshot,
    words: S.words.map(w => ({ id: w.id, text: w.text, ...(w.def ? { definition: w.def } : {}) })),
    patterns: S.patterns.filter(p => p !== '未归类').map(p => ({ name: p, ...(S.pdef[p] ? { definition: S.pdef[p] } : {}) })),
    charts,
  }
}
document.addEventListener('click', e => {
  const act = e.target.getAttribute && e.target.getAttribute('data-act'); if (!act) return
  const [k, v] = act.split(/:(.*)/s)
  const a = A()
  const b = S.sel && S.sel.type === 'box' ? a.boxes.find(x => x.id === S.sel.id) : null
  const bp = S.sel && S.sel.type === 'buy' ? a.buys.find(x => x.id === S.sel.id) : null
  if (k === 'stock') { S.stock = +v; S.sel = null; S.cmp = false }          // 换图：对照自动关
  else if (k === 'mode') { S.mode = v; if (v === 'view') S.cmp = false }
  else if (k === 'tool') S.tool = v
  else if (k === 'tab') S.tab = v
  else if (k === 'cmp') S.cmp = !S.cmp
  else if (k === 'name' && b) { setName(b, v); S.renaming = false }
  else if (k === 'newname' && b) { const t = document.getElementById('newname').value.trim(); if (!t) return; setName(b, wordOf(t)); S.renaming = false }
  else if (k === 'rename' && b) S.renaming = true
  else if ((k === 'a1' || k === 'a0') && b) { b.attrs[v] = k === 'a1' }
  else if (k === 'addattr' && b) { const t = document.getElementById('newattr').value.trim(); if (!t) return; b.attrs[wordOf(t)] = true }
  else if (k === 'letgo' && b) { b.letGo = !b.letGo }
  else if (k === 'detach' && b) { b.detach = !b.detach }
  else if (k === 'delbox' && b) { a.boxes = a.boxes.filter(x => x !== b); S.sel = null }
  else if (k === 'blabel' && bp) { bp.label = v }
  else if (k === 'delbuy' && bp) { a.buys = a.buys.filter(x => x !== bp); S.sel = null }
  else if (k === 'wren') { const w = W(v); const t = prompt('word.text（全局生效）', w.text); if (t && t.trim()) w.text = t.trim() }
  else if (k === 'flag') S.flags.push(v)
  else if (k === 'mtog' && bp) {                  // 成员进 / 出；和默认一致时就不记
    const box = a.boxes.find(x => x.id === v), ov = (S.ov[bp.id] ||= {})
    const now = membersOf(bp, ST()).includes(box)
    delete ov[v]
    if (autoMembers(bp, ST()).has(box) === now) ov[v] = !now
  }
  else if (k === 'mreset' && bp) { delete S.ov[bp.id] }
  else if (k === 'goto') { const [si, id] = v.split(':'); S.stock = +si; S.cmp = false; S.sel = { type: 'buy', id } }   // 侧栏留在 pattern tab，方便在 groups 里挨个看；要改这个买点再点 edit
  else return
  render()
})
document.addEventListener('mouseover', e => { const h = e.target.closest && e.target.closest('[data-hover]'); const id = h ? h.getAttribute('data-hover') : null; if (id !== S.hover) { S.hover = id; draw() } })
document.addEventListener('change', e => {
  const act = e.target.getAttribute && e.target.getAttribute('data-act'); if (!act) return
  const [k, v] = act.split(/:(.*)/s)
  const a = A()
  const b = S.sel && S.sel.type === 'box' ? a.boxes.find(x => x.id === S.sel.id) : null
  const bp = S.sel && S.sel.type === 'buy' ? a.buys.find(x => x.id === S.sel.id) : null
  if (k === 'cur') {
    if (e.target.value === '__new') { const n = prompt('pattern name'); if (n && !S.patterns.includes(n)) S.patterns.push(n); if (n) S.cur = n }
    else S.cur = e.target.value
    if (!isApp(S.cur)) S.cmp = false
  } else if (k === 'vmove') {                       // 整行改归属：这一变体的全部买点
    let to = e.target.value
    if (!to) return
    if (to === '__new') { to = prompt('pattern name'); if (!to) return; if (!S.patterns.includes(to)) S.patterns.push(to) }
    for (const st of STOCKS) for (const bp of annOf(st).buys) if (bp.pattern === S.cur && sigOf(bp, st) === v) bp.pattern = to
    // 只改归属、不切页：留在当前 pattern，挪走的组从这一页消失；看别的 pattern 用顶栏的 pattern 下拉
  } else if (k === 'pdef') S.pdef[S.cur] = e.target.value
  else if (k === 'wdef') W(v).def = e.target.value
  else if (k === 'bnote' && b) { b.note = e.target.value }
  else if (k === 'pnote' && bp) { bp.note = e.target.value }
  else if (k === 'bpat' && bp) { bp.pattern = e.target.value }
  else return
  render()
})
window.addEventListener('resize', draw)
render()
