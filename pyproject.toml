[project]
name = "Trade_Strategy"
version = "0.1.0"
description = "Breakout scanning and multi-factor filtering system for US equities"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pandas-ta>=0.3.14b0",
    "ta-lib>=0.6.8",
    "pandas-stubs~=2.3.3",
    "akshare>=1.18.7",
    "scipy>=1.17.0",
    "scikit-learn>=1.8.0",
    "optuna>=4.7.0",
    "cmaes>=0.12.0",
    "yfinance>=1.2.0",
    "dash>=4.0.0",
    "zhipuai>=2.1.5.20250825",
    "finnhub-python>=2.4.27",
    "requests>=2.32.5",
    "sniffio>=1.3.1",
    "fastembed>=0.7.3",
    "openai>=2.29.0",
    "transformers>=4.57.6",
    "torch>=2.10.0",
    "tiktoken>=0.12.0",
    "pandas-market-calendars>=5.3.2",
    # path2_web 后端(uvicorn/fastapi/sse-starlette)放主依赖而非 optional 组:
    # run_path2_web.py 用裸 `uv run python -m path2_web.main`,而 `uv run` 默认剥离
    # optional-dependencies extra,放主依赖才能让启动命令零 flag 直接可用。
    "uvicorn[standard]>=0.48.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.13.0",
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["BreakoutStrategy"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
