<!-- PROTOTYPE v2，用完即扔：回答「结构化标注存什么、界面和主视图怎么合、标完怎么对照 app」。
     按 2026-10-25 用户拍板的方向重写：标注时只看干净 K 线、不能点选系统事件；名字和说明用用户自己的词、存成可复用清单；
     角色不手填；对照只写人话三层、同轨叠画；对照开关换图自动关；汇总页按名字列对应表、新老分开。
     数据来自 scripts/01-dump-proto-data.py（只读截到 2025-12-31 的副本）。状态只在内存里，刷新即丢。 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; color: #0f172a; background: #fff; }
  #top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px;
         border-bottom: 1px solid #d4d4d8; background: #fafafa; }
  #top .grp { display: flex; gap: 4px; align-items: center; }
  #top .ttl { font-weight: 700; }

  button { font: inherit; padding: 2px 8px; border: 1px solid #a1a1aa; background: #fff; border-radius: 3px; cursor: pointer; }

  #wrap { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 66px); }
  #chartcol { overflow: auto; padding: 4px 0 0 0; }

  #side pre { background: #f4f4f5; padding: 6px; font-size: 11px; max-height: 520px; overflow: auto; white-space: pre-wrap; }
  #side table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #side td, #side th { border: 1px solid #e4e4e7; padding: 3px 4px; vertical-align: top; text-align: left; }

  .ok::before { content: "✓ "; font-weight: 700; }

<body>
<div id="top"></div>
<div class="hint" id="hint"></div>
<div id="wrap"><div id="chartcol"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div><aside id="side"></aside></div>
<script src="data.js"></script>
<script>
'use strict'
const D = window.PROTO_DATA
const SPEC = D.pattern_spec
const APP = SPEC.pattern_id                       // bb_v1
// 配色照搬主视图：node 本色来自 app 声明的 event_styles；进了 match 用本色，过了 where 深灰，只检测到浅灰；K 线绿涨红跌
const NODE_COLOR = SPEC.event_styles
const TIER_QUAL = '#9ca3af', TIER_DET = '#d1d5db', NEUTRAL = '#888888'
const UP = '#47b262', DOWN = '#eb5454'
const WHERE = {}
for (const n of SPEC.topology.nodes) WHERE[n.node_id] = n.where_rules
const APP_NODES = ['burst', 'tb']                 // 看图模式的副图轨（bo 画在主图上，pk 不画）

// 对应表：真实流程里由会话在标完后按跨图证据写；原型里预先写好一份示意，按词的字面对
const MAP = {
  '放量突破': { by: '现成的 burst（突破串）', node: 'burst' },
  '回踩': { by: '现成的回踩', node: 'tb' },
  '横盘': { by: '现成的走势区段里的横盘段（不在任何 app 里，默认参数从没调过）', atom: 'trend', regime: 'sideways' },
  '平台': { by: '现成的平台段（不在任何 app 里，默认参数从没调过）', atom: 'platform' },
}
const DMAP = {                                    // 说明 → where
  '放量': { node: 'burst', clause: 'vol_spike', by: '突破串上「最大一根的量比平时大很多」这条要求' },
  '突破过好几个峰': { node: 'burst', clause: 'distinct_pk', by: '突破串上「越过的峰够多」这条要求' },
  '突破前沉寂够久': { node: 'burst', clause: 'first_drought', by: '突破串上「之前很久没突破过」这条要求' },
  '回踩里没有大跌': { node: 'tb', clause: 'day_drop', by: '回踩上「没有单日大跌」这条要求' },
}
const PLAIN = { first_drought: '之前很久没突破过', distinct_pk: '越过的峰够多', vol_spike: '最大一根的量比平时大很多',
                peak_age: '越过的峰够老', day_drop: '回踩里没有单日大跌' }
// 待验证的默认值
const TOL = 2           // app 事件的起点或终点落在框外几天以内，仍算同一件事
const BUY_TOL = 3       // 正例：app 买点在前后几天以内（或落在回踩事件里）算「会买」
const NOBUY_TOL = 1     // 像但不买：app 买点在前后几天以内算「买了」
const CHANCE_WARN = 0.3 // 随手一框也被认出的比例超过它，就在汇总页提醒
const NEW_MIN = 5       // 新标注不足几个框，只写「还不知道」

// ── 状态（只在内存里） ──
const S = {
  stock: 0, mode: 'annot', cmp: false, tool: 'select', tab: 'edit',
  cur: APP, patterns: [APP, '未归类'],
  words: [], ann: {}, sel: null, drag: null, seq: 1, renaming: false, flags: [],
}

// ── 数据整理 ──
const STOCKS = D.stocks.map(st => {
  const byId = {}
  const matchedIds = new Set()
  for (const m of st.analysis.matches) for (const id of Object.values(m.node_index)) matchedIds.add(id)
  const sys = []
  for (const e of st.analysis.events) {
    if (e.node_id === 'pk') continue
    const it = { id: e.instance_id, node: e.node_id, s: e.start_idx, e: e.end_idx, f: e, matched: matchedIds.has(e.instance_id) }
    sys.push(it); byId[it.id] = it
  }
  for (const e of st.analysis.events) if (e.node_id === 'burst' && matchedIds.has(e.instance_id))
    for (const b of (e.child_refs.members || [])) if (byId[b]) byId[b].matched = true
  for (const a of st.atoms) {
    const it = { id: a.instance_id, node: null, atom: a.kind, regime: a.regime, s: a.start_idx, e: a.end_idx, f: a,
                 label: a.kind === 'platform' ? '平台段' : ({ down: '下跌', sideways: '横盘', up: '上涨' })[a.regime] }
    sys.push(it); byId[it.id] = it
  }
  const matches = st.analysis.matches.map((m, i) => ({ no: i + 1, s: m.start_idx, e: m.end_idx, buy: byId[m.node_index.tb].s,
                                                      tb: byId[m.node_index.tb], nodes: m.node_index }))
  return { symbol: st.symbol, bars: st.bars, sys, byId, matches }
})
const ST = () => STOCKS[S.stock]
const annOf = st => (S.ann[st.symbol] ||= { boxes: [], buys: [], touched: false, sawApp: false })
const A = () => annOf(ST())
const isApp = p => p === APP
const nid = p => p + (S.seq++)
const W = id => S.words.find(w => w.id === id)
const txt = id => (W(id) || {}).text || '（还没起名）'
const dateOf = (st, i) => st.bars[Math.max(0, Math.min(st.bars.length - 1, i))].date
const date = i => dateOf(ST(), i)
function wordOf(text) {             // 用户的词：有就用，没有就新建；同一份清单跨图、跨 pattern 共用
  let w = S.words.find(x => x.text === text)
  if (!w) { w = { id: nid('w'), text, note: '' }; S.words.push(w) }
  return w.id
}
const evalWhere = (node, se) => (WHERE[node] || []).map(r => {
  const v = se.f[r.field]
  const ok = v != null && ({ '>=': v >= r.threshold, '>': v > r.threshold, '<': v < r.threshold, '<=': v <= r.threshold })[r.op]
  return { id: r.clause_id, ok: !!ok }
})
const qualified = se => !se.node || evalWhere(se.node, se).every(r => r.ok)
function markEdit() { const a = A(); if (a.sawApp) a.touched = true }   // 「接触过 app」由界面顺手记

// ── 说明的三种状态：有 / 没有 / 没看过 ──
function descWordsOf(nameId) {      // 所有图上、同名的框用过的说明（按首次出现顺序）
  const out = []
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId)
    for (const w of Object.keys(b.desc)) if (!out.includes(w)) out.push(w)
  return out
}
const descState = (b, w) => b.desc[w] === true ? '有' : b.desc[w] === false ? '没有' : '没看过'
function setName(b, id) {           // 选了名字，以前和它一起用过的说明默认全带上
  b.name = id
  for (const w of descWordsOf(id)) if (!(w in b.desc)) b.desc[w] = true
}
function parentOf(b, a) {           // 框套框：时间上被另一个框包住，默认算属于它
  let p = null
  for (const o of a.boxes) if (o !== b && o.s <= b.s && o.e >= b.e && (o.e - o.s) > (b.e - b.s))
    if (!p || (o.e - o.s) < (p.e - p.s)) p = o
  return p
}

// ── 对照：三层，只出人话 ──
function candidates(b, st) {
  const m = MAP[txt(b.name)]
  if (!m) return null
  const near = x => x >= b.s - TOL && x <= b.e + TOL
  return st.sys.filter(se => (m.node ? se.node === m.node : se.atom === m.atom && (!m.regime || se.regime === m.regime))
                             && se.e >= b.s - TOL && se.s <= b.e + TOL && (near(se.s) || near(se.e)))
}
function verdict(b, st) {
  if (b.letGo) return { st: '放过了', why: [['neu', '你说这个框标宽了：只从样本里拿掉，不改 app']] }
  const c = candidates(b, st)
  if (!c) return { st: '还没进 app', why: [['neu', `对应表里「${txt(b.name)}」还没有接到 app 上`]] }
  const m = MAP[txt(b.name)]
  if (!c.length) {
    const why = [['bad', `${m.by}在这里一段都没出`]]
    if (m.atom) why.push(['neu', '这类 detector 的默认参数从没调过，认不出多半是参数要调，不一定要新写'])
    return { st: '没认出', why }
  }
  const ov = x => Math.min(x.e, b.e) - Math.max(x.s, b.s)
  const better = (x, p) => x.matched !== p.matched ? x.matched : ov(x) > ov(p)   // 进了 match 的优先，其次交叠多的
  const pick = arr => arr.reduce((p, x) => better(x, p) ? x : p)
  const q = c.filter(qualified)
  const ev = q.length ? pick(q) : pick(c)
  const why = []
  const res = ev.node ? evalWhere(ev.node, ev) : []
  for (const r of res) {
    const w = S.words.find(x => DMAP[x.text] && DMAP[x.text].node === ev.node && DMAP[x.text].clause === r.id)
    const s = w ? descState(b, w.id) : null
    if (!r.ok && s === '有') why.push(['bad', `你说有「${w.text}」，app 认为它不够`])
    else if (!r.ok && s === '没有') why.push(['bad', `你说这里没有「${w.text}」，app 却要求它`])
    else if (!r.ok && s === '没看过') why.push(['bad', `app 认为「${w.text}」不够（这条说明你在这个框上还没看过）`])
    else if (!r.ok) why.push(['bad', `还差一条你没提过的要求：${PLAIN[r.id] || r.id}`])
    else if (s === '没有') why.push(['neu', `你说这里没有「${w.text}」，app 认为有`])
  }
  for (const w of Object.keys(b.desc)) if (b.desc[w] && !DMAP[txt(w)]) why.push(['neu', `「${txt(w)}」app 里还没有对应`])
  if (q.length) return { st: '认出', ev, why: [['ok', `${m.by}在这里认出了`], ...why] }
  return { st: '看到了但不够格', ev, why: [['neu', `${m.by}在这里看到了，但没过它的要求`], ...why] }
}
function buyVerdict(bp, st) {
  if (!isApp(bp.pattern)) return { lines: [['neu', `「${bp.pattern}」还没有 app，买点没得对`]] }
  const lines = []
  let buys
  if (bp.label === '正例') {
    const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= BUY_TOL || (bp.idx >= x.tb.s && bp.idx <= x.tb.e))
    buys = !!m
    lines.push(m ? ['ok', 'app 会在这附近买'] : ['bad', 'app 不在这附近买'])
    // 两框之间：前后连上没有
    const a = annOf(st)
    const before = a.boxes.filter(b => b.s <= bp.idx + TOL && b.e >= bp.idx - 40 && MAP[txt(b.name)] && MAP[txt(b.name)].node)
    if (!before.length) lines.push(['neu', '买点前没有接到 app 上的框，只比买点'])
    else {
      const vs = before.map(b => [b, verdict(b, st)])
      const bad = vs.filter(([, v]) => v.st !== '认出' && v.st !== '放过了')
      if (bad.length) lines.push(['neu', `先看没认出的：${bad.map(([b]) => txt(b.name)).join('、')}`])
      else if (m) lines.push(['ok', `${vs.map(([b]) => txt(b.name)).join('、')}都认出了，前后也连上了`])
      else lines.push(['bad', `${vs.map(([b]) => txt(b.name)).join('、')}都认出了，但前后没连上（毛病在两段之间的关系上）`])
    }
  } else {
    const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= NOBUY_TOL)
    buys = !!m
    lines.push(m ? ['bad', `app 会在这买，可你说不买${bp.note ? '：' + bp.note : ''}`] : ['ok', 'app 也不买'])
  }
  return { lines, buys }
}
function seeded(seed) { let r = seed % 2147483646 + 1; return () => (r = (r * 16807) % 2147483647) / 2147483647 }
function chanceOf(nameId) {         // 底：同样宽的框随便挪个位置，被判「认出」的比例
  let hit = 0, tot = 0
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId && !b.letGo && MAP[txt(nameId)]) {
    const w = b.e - b.s, N = st.bars.length, rnd = seeded(b.s * 7919 + b.e + 1)
    for (let k = 0; k < 40; k++) {
      const s = Math.floor(rnd() * Math.max(1, N - w))
      tot++
      if (verdict({ ...b, s, e: s + w, letGo: false }, st).st === '认出') hit++
    }
  }
  return tot ? hit / tot : 0
}

// ── 示例标注：两只股票，演示「点名字带上说明」「后加的说明在旧框上是没看过」「框套框」「三层对照」 ──
;(function seed() {
  const mk = (st, name, s, e, desc = {}, note = '') => {
    const b = { id: nid('b'), name: wordOf(name), s, e, desc: {}, note, letGo: false }
    for (const [k, v] of Object.entries(desc)) b.desc[wordOf(k)] = v
    annOf(st).boxes.push(b); return b
  }
  const buy = (st, idx, label, note = '') => annOf(st).buys.push({ id: nid('p'), idx, pattern: APP, label, note })
  const [s0, s1] = STOCKS
  mk(s0, '横盘', 135, 158)
  mk(s0, '缩量', 140, 146)
  W(wordOf('横盘')).note = '突破前价格窄幅横着走一段'
  mk(s0, '放量突破', 159, 164, { 放量: true, 突破过好几个峰: true })
  W(wordOf('放量突破')).note = '放量越过前面好几个峰'
  mk(s0, '回踩', 164, 167)
  buy(s0, 167, '正例')
  mk(s0, '放量突破', 80, 82, { 放量: true, 突破过好几个峰: true })
  buy(s0, 84, '正例')
  buy(s0, 175, '像但不买', '回踩前一天放量长阴，当天就看得见')
  // 第二张图上才想到「突破前沉寂够久」：第一张图上的同名框，这条就是「没看过」
  mk(s1, '横盘', 98, 106)
  mk(s1, '放量突破', 159, 165, { 放量: true, 突破过好几个峰: false, 突破前沉寂够久: true })
  mk(s1, '回踩', 165, 167)
  buy(s1, 166, '正例')
  annOf(s1).touched = true          // 演示：这张图打开过对照后又改了标注，算老标注
  annOf(s1).sawApp = true
})()

// ── 画图 ──
const NS = 'http://www.w3.org/2000/svg'
const LW = 118, MAIN_H = 380, ROW_H = 30, BR_H = 26
let G = {}
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (text != null) e.textContent = text
  ;(parent || G.svg).appendChild(e)
  return e
}
function lanes() {
  if (S.mode === 'view') return APP_NODES.map(n => ({ key: 'n:' + n, label: n, sub: 'node', node: n }))
  const used = new Set(A().boxes.map(b => b.name))
  const R = S.words.filter(w => used.has(w.id)).map(w => ({ key: w.id, label: w.text, sub: '你的词' }))
  if (used.has(null)) R.push({ key: null, label: '（还没起名）', sub: '' })
  return R
}
function sysOfLane(r) {
  const st = ST()
  if (S.mode === 'view') return st.sys.filter(se => se.node === r.node)
  if (!S.cmp || r.key == null) return []
  const m = MAP[txt(r.key)]
  if (!m) return []
  return st.sys.filter(se => m.node ? se.node === m.node : se.atom === m.atom && (!m.regime || se.regime === m.regime))
}
function colorOfSys(se) {
  if (!se.node) return NEUTRAL                      // 当前 app 之外的 detector（平台段、走势区段）
  if (se.matched) return NODE_COLOR[se.node] || NEUTRAL
  return qualified(se) ? TIER_QUAL : TIER_DET
}
const sel = (type, id) => S.sel && S.sel.type === type && S.sel.id === id
const showApp = () => S.mode === 'view' || S.cmp
function draw() {
  const svg = document.getElementById('chart')
  svg.innerHTML = ''
  const st = ST(), N = st.bars.length, a = A()
  const Wd = Math.max(900, document.getElementById('chartcol').clientWidth - 6)
  const step = (Wd - LW - 10) / N
  const X = i => LW + (i + 0.5) * step, X0 = i => LW + i * step
  const R = lanes()
  const H = MAIN_H + 14 + (showApp() ? BR_H : 0) + R.length * ROW_H + 30
  svg.setAttribute('width', Wd); svg.setAttribute('height', H)
  G = { svg, step, X, X0, N, rowsY: [] }

  // 主图
  let lo = Infinity, hi = -Infinity
  for (const b of st.bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h) }
  const pad = (hi - lo) * 0.08; lo -= pad * 1.6; hi += pad
  const Y = p => 8 + (hi - p) / (hi - lo) * (MAIN_H - 16)
  el('rect', { x: LW, y: 4, width: Wd - LW - 10, height: MAIN_H - 4, fill: '#fff', stroke: '#e4e4e7' })
  el('text', { x: 8, y: 20, 'font-size': 12, 'font-weight': 700 }, null, st.symbol)
  el('text', { x: 8, y: 36, 'font-size': 11, fill: '#52525b' }, null, '主图')
  const cw = Math.max(1.5, step * 0.62)
  st.bars.forEach((b, i) => {
    const up = b.c >= b.o
    el('line', { x1: X(i), x2: X(i), y1: Y(b.h), y2: Y(b.l), stroke: up ? UP : DOWN, 'stroke-width': 1, 'pointer-events': 'none' })
    el('rect', { x: X(i) - cw / 2, y: Y(Math.max(b.o, b.c)), width: cw, height: Math.max(1, Math.abs(Y(b.o) - Y(b.c))),
                 fill: up ? UP : DOWN, stroke: up ? UP : DOWN, 'stroke-width': 0.8, 'pointer-events': 'none' })
  })
  if (S.mode === 'view') for (const se of st.sys) if (se.node === 'bo') {      // 看图模式：主图上的突破
    const x = X(se.s), yy = Y(st.bars[se.s].h) - 6
    el('path', { d: `M${x} ${yy - 7} L${x - 5} ${yy} L${x + 5} ${yy} Z`, fill: colorOfSys(se) })
  }
  if (S.mode === 'annot') for (const bp of a.buys) {                            // 我的买点
