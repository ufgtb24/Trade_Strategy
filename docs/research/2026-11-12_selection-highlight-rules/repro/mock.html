<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选中显示样张</title>
<style>
  :root {
    --ink: #000000; --muted: #6b7280; --bg: #ffffff; --stripe: #ebebeb; --hits-bg: #fffbdb;
    --amber: #fbbf24; --divider: #0050ff; --cursor: #1e293b; --vermilion: #E8875A;
    --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .law { border: 2px solid var(--ink); padding: 10px 14px; max-width: 1180px; margin: 8px 0 16px; font-size: 15px; }
  .scene { margin: 0 0 28px; padding: 12px; border: 1px solid #d1d5db; max-width: 1236px; background: #fff; }
  .scene p { margin: 2px 0 8px; max-width: 1180px; }
  .tag { font: 12px var(--mono); border: 1px solid #555; padding: 0 4px; margin-right: 6px; }
  .now img { width: 1230px; max-width: 100%; display: block; border: 1px solid #d1d5db; }
  .cap { font: 12px var(--mono); margin: 6px 0 2px; }
  .bar { display: grid; grid-template-columns: 112px 110px 230px 140px 150px 1fr 150px 140px 40px; background: #f1f2f4;
         font: 12.5px var(--mono); border-bottom: 1px solid #d1d5db; width: 1230px; }
  .bar > div { padding: 3px 6px; border-right: 1px solid #d1d5db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .na { color: #6b7080; }
  .bar .kindbox { background: #fff; border: 2px solid #000; font-weight: 700; padding: 0 4px; }
  .bar .key { border: 1px solid #555; padding: 0 3px; margin-right: 4px; font-size: 11px; }
  .bar .key.na { border-color: #b0b4bb; }
  .row2 { display: flex; gap: 16px; align-items: flex-start; }
  .list { font: 12px var(--mono); border: 1px solid #d1d5db; width: 230px; }
  .list .h { padding: 3px 6px; font-weight: 700; border-bottom: 1px solid #d1d5db; }
  .list .r { padding: 2px 8px; border-bottom: 1px solid #f0f0f0; }
  .list .r.rel { box-shadow: inset 3px 0 0 #1a80ba; }
  .list .r.cur { box-shadow: inset 0 0 0 2px #111111; }
  .list .r.rel.cur { box-shadow: inset 3px 0 0 #1a80ba, inset 0 0 0 2px #111111; }
  svg text { font-family: var(--mono); }
  .legend td { padding: 2px 10px 2px 0; vertical-align: middle; }
</style>
</head>
<body>
<h1>选中显示样张（designer，静态，按 CRNC / new_step / compare 的真数据画）</h1>
<div class="law" id="law"></div>
<div id="legend"></div>
<div id="scenes"></div>
<script src="designer_mockdata.js"></script>
<script>
const M = window.MOCK
const W0 = M.W0, W1 = M.W1
window.DIM_DEFAULT = 0.5             // 画淡的不透明度：天蓝下「淡后对隔行底」和「照常对淡后」两头相等、都约 1.6（designer_contrast.py），待验证
window.COL0 = { plateau: M.colors.plateau, old_plat: M.colors.old_plat, step: M.colors.step, new_plat: M.colors.new_plat, today: M.colors.today }
const DIM = window.DIM_DEFAULT, COL = window.COL0
const TIER_H = { in_hit: 1, qualified: 0.65, detected: 0.4 }
const GRAY = { qualified: '#9ca3af', detected: '#b4bac2' }
const BANDS = [['plateau', 'plateau  站上新平台', 0], ['old_plat', '├ old_plat', 1], ['step', '├ step', 1], ['new_plat', '├ new_plat', 1], ['today', '└ today', 1]]
const LAW = '总规律：<b>粗框只框选中的那一个，它外面那几层（显示栏 <code>in</code> 的各节）各在自己下面画一道粗底线。选中那一个的组成、它牵出的 hit 和这些 hit 的组成落在哪一边（app 的记号、用户的记号），那一边其余的记号就画淡，只留路径上每一节的同一层（← / → 在它们之间换的那些）照常。</b>'
document.getElementById('law').innerHTML = LAW
const d2 = (i) => (M.dates[i] || '').slice(5)
const date = (i) => M.dates[i] || ''
const ev = M.events

// ── 规律本身：输入选中路径，输出「选中 / 外层 / 照常」三样（各现场只换输入，不手调）──
function famByKey(k) { return M.hitFams.find(f => f.key === k) }
function hitsOfDay(day) { const out = []; for (const f of M.hitFams) for (const b of f.buys) if (b.day === day) out.push(...b.hitIds); return out }
function bandEvents(band, level) { const s = new Set(); for (const f of M.bands[level][band] || []) for (const id of f.memberIds) s.add(id); return [...s] }
function sampleDay(id) { return M.sampleDays.find(s => s.id === id)?.day }
function boxDay(id) { const b = M.boxes.find(x => x.id === id); return dayOf(b.end) }
function dayOf(ds) { for (const k in M.dates) if (M.dates[k] === ds) return +k; return null }
function fbHits(id) {
  const f = M.feedback.find(x => x.id === id); const s = dayOf(f.start), e = dayOf(f.end); const fs = dayOf(f.family_start)
  const out = new Set()
  for (const fam of M.hitFams) for (const b of fam.buys) if (b.day >= s && b.day <= e) b.hitIds.forEach(h => out.add(h))
  if (f.target === 'family') for (const fam of M.hitFams) if (fam.start === fs) fam.hitIds.forEach(h => out.add(h))
  return [...out]
}
/** 牵出的 hit（= 选中卡 `hits` 行数到的那几次） */
function hitsOf(s, level) {
  switch (s.kind) {
    case 'hit_family': return famByKey(s.key).hitIds
    case 'buy': return famByKey(s.fam).buys.find(b => b.day === s.day).hitIds
    case 'hit': return [s.id]
    case 'event': return M.using[s.id] || []
    case 'sample': return hitsOfDay(sampleDay(s.id))
    case 'box': return hitsOfDay(boxDay(s.id))
    case 'feedback': return fbHits(s.id)
    default: return []
  }
}
/** 它自己的组成：一个 event 的子段（往下，沿 child_refs）；一个 node 的组成是它那条 band 上画着的 event */
function compOf(s, level) {
  if (s.kind === 'event') return [s.id, ...(ev[s.id]?.desc || [])]
  if (s.kind === 'node') return bandEvents(s.band, level)
  return []
}
/** 外层装着的那一串（规格 5.8「装着」）：只亮记号本身，不带它们的组成 */
function chainOf(o, level) {
  switch (o.kind) {
    case 'hit_family': return { hits: famByKey(o.key).hitIds, evs: [] }
    case 'buy': return { hits: famByKey(o.fam).buys.find(b => b.day === o.day).hitIds, evs: [] }
    case 'event': return { hits: M.using[o.id] || [], evs: [] }
    case 'feedback': return { hits: fbHits(o.id), evs: [] }
    case 'sample': return { hits: hitsOfDay(sampleDay(o.id)), evs: [] }
    case 'box': return { hits: hitsOfDay(boxDay(o.id)), evs: [] }
    case 'node': return { hits: [], evs: bandEvents(o.band, level) }
    default: return { hits: [], evs: [] }
  }
}
function roles(path, level) {
  if (!path.length) return null
  const sel = path[path.length - 1]
  const outer = path.slice(0, -1)
  const litHits = new Set(hitsOf(sel, level))          // 牵出的 hit（连组成）
  const litEv = new Set(compOf(sel, level))            // 它自己的组成（event 含它自己，画时它是粗框）
  for (const h of litHits) for (const e of (M.bound[h] || [])) litEv.add(e)
  const rangeHits = new Set(), rangeEv = new Set()     // 外层装着的那一串（只记号本身）
  for (const o of outer) { const c = chainOf(o, level); c.hits.forEach(h => rangeHits.add(h)); c.evs.forEach(e => rangeEv.add(e)) }
  // 最外一节的同一层：图上和它同种的东西（规格 5.8「同一层」：没有上一节就是这张图上的同种东西）
  const top = path[0]
  if (top.kind === 'hit_family') for (const f of M.hitFams) f.hitIds.forEach(h => rangeHits.add(h))
  const userPeerSamples = new Set(top.kind === 'sample' ? M.samples.map(x => x.id) : [])
  const selfOnly = sel.kind === 'event' && litEv.size === 1
  // 画淡只由「组成、牵出」触发；路径上各节的同一层只是留着不淡
  const appDim = litHits.size > 0 || (litEv.size > 0 && !selfOnly)
  // 用户那一边：只有样本有组成（它的成员框）
  const userLitBoxes = new Set(sel.kind === 'sample' ? (M.samples.find(x => x.id === sel.id)?.members || []) : [])
  const userDim = userLitBoxes.size > 0
  return { sel, outer, litHits, litEv, rangeHits, rangeEv, appDim, userDim, userLitBoxes, userPeerSamples }
}

// ── 画 ──
function el(tag, attrs, parent) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e }
function frame(g, x, y, w, h) {   // 粗框：深色 2.5px、外扩 1.5px（现在 focus 粗框的尺寸），不带阴影、不带白圈
  el('rect', { x: x - 1.5, y: y - 1.5, width: w + 3, height: h + 3, fill: 'none', stroke: '#111', 'stroke-width': 2.5 }, g)
}
// 外层底线：2.5px，压在那一行的底线上（底边下沿 -1 起），横跨那个东西自己的起止（现在「那一族的行粗底线」的画法）
function underline(g, x, yBottom, w) { el('rect', { x, y: yBottom - 1, width: w, height: 2.5, fill: '#111' }, g) }

function draw(container, sc, opt = {}) {
  const level = sc.level || 'in_hit'
  const DIM = sc.dim ?? window.DIM_DEFAULT
  const COL = sc.blue ? Object.fromEntries(Object.entries(window.COL0).map(([k, v]) => [k, v === '#1e9be0' ? sc.blue : v])) : window.COL0
  const R = roles(sc.path, level)
  const LABEL_W = opt.labelW ?? 132, PLOT_W = opt.plotW ?? 1080, X0 = LABEL_W + 4
  const N = W1 - W0 + 1, unit = PLOT_W / N
  const W = X0 + PLOT_W + 14
  const xc = (d) => X0 + (d - W0 + 0.5) * unit
  const half = Math.max(1, 0.4 * unit)
  const xl = (d) => xc(d) - half, xr = (d) => xc(d) + half
  const LANE_H = 14, GAP = 4, PAD = 5
  const lanesOf = (band) => Math.max(1, ...((M.bands[level][band] || []).map(f => f.lane + 1)))
  // 竖向布局
  let y = 0
  const rows = {}
  rows.feat1 = [y, 26]; y += 26
  rows.feat2 = [y, 26]; y += 26
  rows.user = [y, 34]; y += 34
  rows.divider = y + 3; y += 8
  rows.hits = [y, 12 + 2 * (LANE_H + GAP) + 18 + 6]
  const hitsLaneTop = (l) => rows.hits[0] + 14 + l * (LANE_H + GAP)
  const fbTop = rows.hits[0] + 14 + 2 * (LANE_H + GAP) + 2
  y += rows.hits[1]
  for (const [band] of BANDS) { const h = PAD * 2 + lanesOf(band) * LANE_H + (lanesOf(band) - 1) * GAP; rows[band] = [y, h]; y += h }
  const axisY = y; y += 20
  const H = y
  const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, container)
  // 底色
  el('rect', { x: 0, y: rows.user[0], width: W, height: rows.user[1], fill: '#fffbdb' }, svg)
  el('rect', { x: 0, y: rows.hits[0], width: W, height: rows.hits[1], fill: '#fffbdb' }, svg)
  BANDS.forEach(([band], i) => { if (i % 2 === 0) el('rect', { x: 0, y: rows[band][0], width: W, height: rows[band][1], fill: '#ebebeb' }, svg) })
  el('rect', { x: 0, y: rows.divider - 1.25, width: W, height: 2.5, fill: '#0050ff' }, svg)
  const DOT = opt.mode === 'dot'
  const layerDim = el('g', { opacity: R && !DOT ? DIM : 1 }, svg)   // 画淡的（备选 dot：不画淡）
  const layerOn = el('g', {}, svg)                          // 照常的
  const layerCursor = el('g', {}, svg)                      // 当前日竖线：压在记号上（现状 z:30，窄格连成一片时不被盖住），但在粗框、底线之下
  const layerTop = el('g', {}, svg)                         // 选中框、外层底线、竖线
  const pick = (lit) => (R && R.appDim && !lit ? layerDim : layerOn)
  const pickU = (lit) => (R && R.userDim && !lit ? layerDim : layerOn)
  const dot = (lit, cx, cy) => { if (DOT && R && lit) { el('circle', { cx, cy, r: 3.6, fill: '#fff' }, layerTop); el('circle', { cx, cy, r: 2.4, fill: '#000' }, layerTop) } }
  const isOuter = (pred) => R && R.outer.some(pred)
  const selIs = (pred) => R && pred(R.sel)
  // 轨名
  const label = (text, yy, opts = {}) => {
    const t = el('text', { x: 6 + (opts.indent || 0), y: yy, 'font-size': 13, fill: '#000' }, svg); t.textContent = text
    return { x: 6 + (opts.indent || 0), w: [...text].reduce((n, ch) => n + (ch.charCodeAt(0) > 0x2e80 ? 13 : 7.8), 0) }
  }
  const tagLabel = (text, yy) => { const w = text.length * 13 + 6; el('rect', { x: 4, y: yy - 13, width: w, height: 17, fill: '#ebebeb' }, svg); const t = el('text', { x: 7, y: yy, 'font-size': 13 }, svg); t.textContent = text }
  tagLabel('底部平稳', rows.feat1[0] + 18); tagLabel('站上新平台', rows.feat2[0] + 18)
  { const t = el('text', { x: 78, y: rows.feat2[0] + 18, 'font-size': 12 }, svg); t.textContent = '⇣ plateau' }
  label('user', rows.user[0] + 15)
  { const t = el('text', { x: 6, y: rows.hits[0] + 22, 'font-size': 13, 'font-weight': 700 }, svg); t.textContent = 'hits' }
  const bandLabelBox = {}
  for (const [band, text] of BANDS) bandLabelBox[band] = label(text, rows[band][0] + 17, { indent: band === 'plateau' ? 0 : 6 })
  // 用户这边：两条特征轨的框（虚线）、user 行的样本跨度与 ▲（用户的东西不画淡）
  const featRow = { 'w-pc-8': rows.feat1, 'w-pc-11': rows.feat2 }
  for (const b of M.boxes) {
    const r = featRow[b.feature]; if (!r) continue
    const s = Math.max(W0, dayOf(b.start) ?? W0), e = dayOf(b.end)
    const x0 = s === W0 && dayOf(b.start) === null ? X0 - 2 : xl(s) - 0.1 * unit, x1 = xr(e) + 0.1 * unit
    const boxSel = selIs(s2 => s2.kind === 'box' && s2.id === b.id)
    const gb = boxSel || isOuter(q => q.kind === 'box' && q.id === b.id) ? layerOn : pickU(R && R.userLitBoxes.has(b.id))
    el('rect', { x: Math.max(X0 - 2, x0), y: r[0] + 6, width: x1 - Math.max(X0 - 2, x0), height: 14, fill: boxSel ? 'rgba(0,0,0,0.10)' : 'none', stroke: '#000', 'stroke-width': boxSel ? 2.5 : 1.3, 'stroke-dasharray': '5 3' }, gb)
    if (isOuter(q => q.kind === 'box' && q.id === b.id)) underline(layerTop, Math.max(X0 - 2, x0), r[0] + 21, x1 - Math.max(X0 - 2, x0))
  }
  const uTop = rows.user[0] + 8, uBot = rows.user[0] + 26
  for (const s of M.samples) {
    const day = sampleDay(s.id); if (day == null) continue
    const x = xc(day)
    const on = selIs(q => q.kind === 'sample' && q.id === s.id) || isOuter(q => q.kind === 'sample' && q.id === s.id)
    const sel2 = selIs(q => q.kind === 'sample' && q.id === s.id)   // 选中的样本跨度：现有画法，2.5px 虚线 + 浅灰填充
    el('rect', { x: X0 - 2, y: uTop, width: x - X0 + 2, height: uBot - uTop, fill: sel2 ? 'rgba(0,0,0,0.10)' : 'none', stroke: '#000', 'stroke-width': sel2 ? 2.5 : 1.3, 'stroke-dasharray': '5 3' }, on ? layerOn : pickU(R && R.userPeerSamples.has(s.id)))
  }
  M.samples.forEach((s, i) => {
    const day = sampleDay(s.id); if (day == null) return
    const x = xc(day)
    const sSel = selIs(q => q.kind === 'sample' && q.id === s.id)
    const gs = sSel || isOuter(q => q.kind === 'sample' && q.id === s.id) ? layerOn : pickU(R && R.userPeerSamples.has(s.id))
    el('polygon', { points: `${x},${uTop + 1} ${x - 8},${uBot} ${x + 8},${uBot}`, fill: '#000', stroke: '#000', 'stroke-width': sSel ? 3 : 1.5 }, gs)
    const t = el('text', { x: x + 11, y: uBot - 3, 'font-size': 12, 'font-weight': 700 }, gs); t.textContent = 'abc'[i] + ' ✓'
    if (isOuter(q => q.kind === 'sample' && q.id === s.id)) underline(layerTop, X0 - 2, uBot + 1, x - X0 + 2)
  })
  // 反馈带（hits 区里，hit 各行之下）
  for (const f of M.feedback) {
    const s = dayOf(f.start), e = dayOf(f.end); if (s == null || e == null) continue
    const x0 = xl(s), x1 = Math.min(xr(e), X0 + PLOT_W)
    el('rect', { x: x0, y: fbTop, width: x1 - x0, height: 13, rx: 2, fill: '#E8875A', stroke: '#555', 'stroke-width': 1.5 }, svg)
    const t = el('text', { x: x0 + 3, y: fbTop + 10, 'font-size': 10 }, svg); t.textContent = f.nodes.join(' ')
    if (selIs(q => q.kind === 'feedback' && q.id === f.id)) {
      frame(layerTop, x0, fbTop, x1 - x0, 13)
      // 选中反馈的竖带：很淡的底 + 两侧深色实线边（现有画法，不改）
      el('rect', { x: x0, y: 0, width: x1 - x0, height: axisY, fill: 'rgba(0,0,0,0.05)' }, layerTop)
      el('rect', { x: x0 - 0.75, y: 0, width: 1.5, height: axisY, fill: '#333' }, layerTop)
      el('rect', { x: x1 - 0.75, y: 0, width: 1.5, height: axisY, fill: '#333' }, layerTop)
    }
    if (isOuter(q => q.kind === 'feedback' && q.id === f.id)) underline(layerTop, x0, fbTop + 14, x1 - x0)
  }
  // hits 行
  const anyBuyCount = new Map()
  for (const f of M.hitFams) {
    const top = hitsLaneTop(f.lane), x0 = Math.max(X0, xl(f.start)), x1 = Math.min(X0 + PLOT_W, xr(f.end))
    const famLit = !R || f.hitIds.some(h => R.litHits.has(h) || R.rangeHits.has(h))
    const g = pick(famLit)
    el('rect', { x: x0, y: top + LANE_H - 1, width: x1 - x0, height: 1, fill: '#6b7280' }, g)
    if (f.start >= W0) el('rect', { x: xl(f.start), y: top + LANE_H * 0.4, width: 1.5, height: LANE_H * 0.6, fill: '#6b7280' }, g)
    if (isOuter(q => q.kind === 'hit_family' && q.key === f.key)) underline(layerTop, x0, top + LANE_H, x1 - x0)
    if (selIs(q => q.kind === 'hit_family' && q.key === f.key)) frame(layerTop, x0, top, x1 - x0, LANE_H + 2)
    for (const m of f.marks) {
      if (m.end < W0 || m.end > W1) continue
      const lit = !R || m.hitIds.some(h => R.litHits.has(h) || R.rangeHits.has(h))
      const gg = pick(lit)
      el('rect', { x: xl(m.start), y: top, width: xr(m.end) - xl(m.start), height: LANE_H, fill: '#fbbf24' }, gg)
      dot(lit, xc(m.end), top + LANE_H + 4)
      const isSel = selIs(q => (q.kind === 'buy' && q.fam === f.key && q.day === m.end) || (q.kind === 'hit' && m.hitIds.includes(q.id)))
      if (isSel) frame(layerTop, xl(m.start), top, xr(m.end) - xl(m.start), LANE_H)
    }
    for (const b of f.buys) {
      if (b.day < W0 || b.day > W1) continue
      const lit = !R || b.hitIds.some(h => R.litHits.has(h) || R.rangeHits.has(h))
      const gg = pick(lit)
      const x = xc(b.day), w = Math.max(3, Math.min(6, unit * 0.32))
      el('polygon', { points: `${x - w},${top + 0.5} ${x + w},${top + 0.5} ${x},${top + LANE_H * 0.65}`, fill: '#111' }, gg)
      if (b.hitIds.length >= 2 && unit >= 8) { const t = el('text', { x, y: top - 3, 'font-size': 10, 'font-weight': 700, 'text-anchor': 'middle' }, gg); t.textContent = String(b.hitIds.length) }
    }
  }
  // band
  for (const [band] of BANDS) {
    const [btop] = rows[band]
    const laneTop = (l) => btop + PAD + l * (LANE_H + GAP)
    if (isOuter(q => q.kind === 'node' && q.band === band)) underline(layerTop, bandLabelBox[band].x, btop + 23, bandLabelBox[band].w)
    // 选中的 event 在这一档画不出来：轨名旁挂 hidden，粗框框它（它的替身）
    if (R && R.sel.kind === 'event' && ev[R.sel.id]?.node === band && !(M.bands[level][band] || []).some(f => f.memberIds.includes(R.sel.id))) {
      const tx = bandLabelBox[band].x + bandLabelBox[band].w + 10, ty = btop + 5
      el('rect', { x: tx, y: ty, width: 52, height: 16, fill: '#fff', stroke: '#555', 'stroke-width': 1 }, svg)
      const t = el('text', { x: tx + 4, y: ty + 12, 'font-size': 11.5 }, svg); t.textContent = 'hidden'
      frame(layerTop, tx, ty, 52, 16)
    }
    if (selIs(q => q.kind === 'node' && q.band === band)) frame(layerTop, bandLabelBox[band].x - 2, btop + 4, bandLabelBox[band].w + 4, 17)
    for (const f of M.bands[level][band] || []) {
      const top = laneTop(f.lane)
      const famLit = !R || f.memberIds.some(id => R.litEv.has(id) || R.rangeEv.has(id))
      if (f.multi) {
        const g = pick(famLit)
        const x0 = Math.max(X0, xl(f.start)), x1 = Math.min(X0 + PLOT_W, xr(f.end))
        el('rect', { x: x0, y: top + LANE_H - 1, width: x1 - x0, height: 1, fill: '#6b7280' }, g)
        if (f.start >= W0) el('rect', { x: xl(f.start), y: top + LANE_H * 0.4, width: 1.5, height: LANE_H * 0.6, fill: '#6b7280' }, g)
      }
      for (const m of f.marks) {
        if (m.end < W0 || m.start > W1) continue
        const lit = !R || m.memberIds.some(id => R.litEv.has(id) || R.rangeEv.has(id))
        const g = pick(lit)
        const color = m.tier === 'in_hit' ? COL[band] : GRAY[m.tier]
        const h = LANE_H * TIER_H[m.tier]
        let bx, by, bw, bh
        if (m.kind === 'point') {
          const x = xc(m.start), w = Math.max(5, Math.min(9, unit * 0.35)) * (0.6 + 0.4 * TIER_H[m.tier]), cy = top + LANE_H / 2
          el('polygon', { points: `${x},${cy + 7 * TIER_H[m.tier]} ${x - w},${cy - 6 * TIER_H[m.tier]} ${x + w},${cy - 6 * TIER_H[m.tier]}`, fill: color }, g)
          bx = x - w; by = cy - 6; bw = 2 * w; bh = 13
        } else {
          const x0 = Math.max(X0, xl(m.start)), x1 = Math.min(X0 + PLOT_W, xr(m.end))
          el('rect', { x: x0, y: top + LANE_H - h, width: Math.max(2, x1 - x0), height: h, fill: color }, g)
          bx = x0; by = top + LANE_H - h; bw = Math.max(2, x1 - x0); bh = h
        }
        if (!selIs(q => q.kind === 'event' && m.memberIds.includes(q.id))) dot(lit, bx + bw - Math.min(bw, 2 * half) / 2, by + bh / 2)
        if (selIs(q => q.kind === 'event' && m.memberIds.includes(q.id))) frame(layerTop, bx, by, bw, bh)
        if (isOuter(q => q.kind === 'event' && m.memberIds.includes(q.id))) {
          const s0 = Math.max(X0, xl(f.start)), s1 = m.kind === 'point' ? bx + bw : Math.min(X0 + PLOT_W, xr(m.end))
          underline(layerTop, m.kind === 'point' ? bx : s0, top + LANE_H, s1 - (m.kind === 'point' ? bx : s0))
        }
      }
    }
  }
  // 日期轴
  for (let d = W0; d <= W1; d++) {
    if ((d - W0) % Math.max(1, Math.round(60 / unit)) !== 0) continue
    const t = el('text', { x: xc(d), y: axisY + 14, 'font-size': 10.5, 'text-anchor': 'middle', fill: '#000' }, svg); t.textContent = d2(d)
  }
  // 当前日竖线
  if (sc.cursor != null) {
    el('line', { x1: xc(sc.cursor), x2: xc(sc.cursor), y1: 0, y2: axisY, stroke: '#fff', 'stroke-width': 3 }, layerCursor)
    el('line', { x1: xc(sc.cursor), x2: xc(sc.cursor), y1: 0, y2: axisY, stroke: '#1e293b', 'stroke-width': 1 }, layerCursor)
  }
  return svg
}

function slot(s) { if (!s || s.mode === 'none') return null; return s.mode === 'into' ? `into ${s.noun} ×${s.n}` : `${s.noun} ${s.k}/${s.n}` }
function bar(container, b) {
  const div = document.createElement('div'); div.className = 'bar'
  const cell = (k, v) => { const c = document.createElement('div'); c.innerHTML = v == null || v === '' ? `${k} <span class="na">—</span>` : `${k} ${v}`; div.appendChild(c) }
  const kc = document.createElement('div'); kc.innerHTML = b ? `kind <span class="kindbox">${b.kind}</span>` : 'kind <span class="na">—</span>'; div.appendChild(kc)
  cell('node', b?.node); cell('date', b?.date); cell('name', b?.name); cell('diff', b?.diff)
  cell('in', b?.in?.length ? b.in.join(' › ') : null)
  const k1 = slot(b?.day), k2 = slot(b?.stack)
  const s1 = document.createElement('div'); s1.innerHTML = `<span class="key ${k1 ? '' : 'na'}">←/→</span>${k1 ?? '<span class="na">—</span>'}`; div.appendChild(s1)
  const s2 = document.createElement('div'); s2.innerHTML = `<span class="key ${k2 ? '' : 'na'}">↑/↓</span>${k2 ?? '<span class="na">—</span>'}`; div.appendChild(s2)
  const e = document.createElement('div'); e.innerHTML = '<span class="key">Esc</span>'; div.appendChild(e)
  container.appendChild(div)
}
function hitList(container, path, title) {
  const R = roles(path, 'in_hit')
  const sel = R.sel
  const rows = []
  for (const f of M.hitFams) for (const b of f.buys) for (const h of b.hitIds) rows.push({ day: b.day, h, f: f.key })
  rows.sort((a, b) => a.day - b.day)
  const box = document.createElement('div'); box.className = 'list'
  box.innerHTML = `<div class="h">${title}</div>`
  for (const r of rows.slice(0, 18)) {
    const cut = (M.bound[r.h] || []).includes('step_789#0') ? 'step→11-21' : (M.bound[r.h] || []).includes('step_789_790#0') ? 'step→11-22' : ''
    // 列表：选中的那一个由哪几次 hit 组成（一次 hit / 买点日 / 一族），那几行黑粗边；它牵出的 hit 左蓝条；同一层不标
    const own = sel.kind === 'hit' ? [sel.id] : sel.kind === 'buy' ? famByKey(sel.fam).buys.find(b => b.day === sel.day).hitIds
      : sel.kind === 'hit_family' ? famByKey(sel.key).hitIds : []
    const d = document.createElement('div'); d.className = 'r' + (R.litHits.has(r.h) ? ' rel' : '') + (own.includes(r.h) ? ' cur' : '')
    d.textContent = `${d2(r.day)}  ${cut}`
    box.appendChild(d)
  }
  const more = document.createElement('div'); more.className = 'r'; more.textContent = `… 共 ${rows.length} 行`; box.appendChild(more)
  container.appendChild(box)
}
