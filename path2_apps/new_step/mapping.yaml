    - {where: plateau.step_big, from: [s-pc-55, s-pc-57], state: "from_definition 2026-11-16 第 2 轮按新切法重定门槛 0.4→0.8（保持原余量比例），由正样本 QBTS 2024-11 定（软计数，见 2026-11-16-2.plan.md 末尾）；范围外砍掉的 58 天大半由它砍（GEVO 2025-07 族 21 天、QBTS 2025-04 族、CRNC 2025-07 族），待验证"}
    - {where: plateau.step_strong, from: [s-pc-59], state: "from_definition 2026-11-16 第 2 轮按新切法重定比左侧门槛 4→4.8，由正样本 GEVO 2024-09 定；比右侧不变，由 DXYZ 2024-11 定，待验证"}
