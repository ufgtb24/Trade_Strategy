<style>
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }   /* 页面竖滚动条的位置常留：整页截图时页面变高、滚动条出没，布局宽度不跟着变（r1 整页截图侧栏右缘被裁掉约 16px） */
  /* 文字一律黑色：用户的和程序的靠浅灰底 + 字体区分，不靠字色；灰字只留给空着 / 没选上（占位提示、others 里的块）。用户 2026-10-26 定 */
  :root { --bizbg: #e9e9ec; --biz: #111; --sym: #111; --line: #e4e4e7; --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; color: var(--biz); background: #fff; }
  .sym { font-family: var(--mono); font-size: 11.5px; color: var(--sym); }
  .biz { font-family: system-ui, sans-serif; color: var(--biz); }
  .biz:not(input):not(textarea) { background: var(--bizbg); padding: 0 4px; border-radius: 3px; }   /* 输入框外的自然语言：浅灰底 */
  .row.nw > .biz { white-space: nowrap; }   /* 属性一行里的属性名不从字中间折断（原先「突破过好几个峰」折成两行，2026-10-30 r1） */
  /* 定义这类一整句的输入：多行、按内容长高（renderSide 里量），整句都看得见，不在框里截断（原先单行输入框只露出前半句，2026-10-30 r1） */
  textarea { display: block; width: 100%; font: 13px/1.45 system-ui, sans-serif; color: var(--biz); padding: 1px 4px; border: 1px solid #a1a1aa; border-radius: 3px; resize: none; overflow: hidden; }
  textarea::placeholder { font-family: var(--mono); font-size: 11px; color: #a1a1aa; }
  #top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 10px;
         border-bottom: 1px solid #d4d4d8; background: #fafafa; }
  #top .grp { display: flex; gap: 4px; align-items: center; }
  #top .ttl { font-weight: 700; }
  .tag { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border: 1px solid #71717a; border-radius: 3px; color: #111; white-space: nowrap; }
  :root { --tier-q: #9ca3af; --tier-d: #d1d5db; }   /* band 档位灰只在这里定一处：主图 band、档位签（JS 照它画）与侧栏档位签同一来源 */
  .tag.tq { background: var(--tier-q); } .tag.td { background: var(--tier-d); }   /* 同 band 档位：qualified 深灰、detected 浅灰 */
  .tag.on { background: #111; color: #fff; border-color: #111; }   /* 黑底白字 = 选中 / 按下（你选的），只这一个意思（配色规范 2026-10-29） */
  :root { --bad: #D55E00; }   /* 朱红：用户色板里唯一和主视图现用色都分得开的颜色 */
  .tag.bad { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 700; }   /* 朱红底白字 = app 的判断和你的标注不一致（漏买 / 误买、和你的属性相反、没连上） */
  /* 来源底色：会话翻译出来的 = 中蓝（冷），app 跑出来的 = 浅琥珀（暖）；用户自己的和界面从它算出来的不加底色。
     中蓝必须比用户自然语言的浅灰底（#e9e9ec，明度约 92）暗一档：原先的浅蓝 #dbeafe 明度约 92，用户实测和浅灰分不开（2026-10-26）；现 #93c5fd 明度约 78 */
  /* app 琥珀 2026-10-29 由 #fdecc0 加深到 #F2C25C（用户从浅 / 中 / 深三档里挑了浅一点那档）：原色和白底对比 1.17、和浅灰 chip 1.03，按段拆开后看不出琥珀那一段；新色对白底 1.66、对朱红 2.33 */

  .st-app { background: var(--st-app); }
  .st-app:has(> .bad:only-child) { background: none; }   /* 朱红取代琥珀：app 段里只有一枚朱红签时不再外包一圈琥珀（规范：朱红只盖 app 那一段并取代它的琥珀） */

  span.seg.st-session, span.seg.st-app { display: inline; padding: 0 3px; border-radius: 2px; }
  span.seg.bad { background: var(--bad); color: #fff; font-weight: 700; padding: 0 3px; border-radius: 2px; }

  /* 顶栏窄屏时会折成两行：#wrap 的高度按顶栏实测高度算（--toph，renderTop 里量），原先写死 40px，折行后页面多出一截、主图的横向滚动条落到视口外 */

  #chartcol { overflow: auto; padding: 4px 0 0 0; scrollbar-gutter: stable; }

  .blk { border: 1px solid #a1a1aa; border-radius: 4px; padding: 4px 7px; margin: 5px 0; }   /* 一项一块：侧栏统一的分隔规则 */

  .grow { flex: 1; }
  .row.nw { flex-wrap: nowrap; }

  .nest.v { flex-direction: column; align-items: flex-start; }

  .chip.neg { text-decoration: line-through; }                                            /* 必须没有的名称：有它就不买 */

     各层的线：块框中灰 1px；点开那排左边的竖线深灰 2px（「挂在上面那一行下面」的记号，要比块框醒目）；排与排的分隔线、卡框浅灰 1px。主图上正打开的那个买点：卡的框加粗变黑 */
  .vth { display: inline-flex; flex-direction: column; align-items: stretch; width: min-content; border: 1px solid #d4d4d8; border-radius: 4px; margin: 0 0 4px 0; vertical-align: top; background: #fff; overflow: hidden; }   /* 卡和卡左右的间距由外面那一行的 gap 给 */

  .th .take { position: absolute; padding: 0 2px; font-size: 9px; line-height: 9px; border: 1px solid #111; background: #fff; }   /* 缩略图里「画了没收」：点一下收进 */                                             /* 起新词时和输入相近的已有词 */

  .chip.off.cand { border-color: #111; border-style: dashed; color: #111; }   /* 可能画了没收：比一般没收的深一档 */

  /* 成员链、未归类 sequence 里两段之间的 →（先后）：和 chip 同高、和链尾三角同号，箭头中线对齐 chip 中线（原先 11px、贴在 chip 上沿，读成一个小短横，2026-10-30 r2） */
  .arr { font-family: var(--mono); font-size: 14px; color: var(--sym); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; padding-top: 2px; }

<script src="../../2026-10-26_annotation-workflow-polish/repro/data.js"></script>
<script>
'use strict'
const D = window.PROTO_DATA
const SPEC = D.pattern_spec
// 假 app：照「横盘突破回踩」的标注写的（演示用；真实流程里由会话写，参照骨架和 mapping 随 app 进 git，不进标注文件）
const FAKE = {
  id: 'sbt_v1', ver: 2, pattern: '横盘突破回踩',
  // mapping（flow v2 §1）：每个名字一行——级 must 必须有 / optional 可有可无 / must_not 必须没有 / excluded 不放；
  // 由谁来认 res：顶层写 node 名；挂在某一段下面的写落法 where / child / negation（不写 node:burst，免得读成「横盘由 burst 来认」，critic 5.2）
  table: {
    '放量突破': { level: 'must', res: 'node:burst', node: 'burst', doc: '挨得很近的一串突破' },
    '回踩': { level: 'must', res: 'node:tb', node: 'tb', doc: '突破后回落、企稳能买的那段' },
    '横盘': { level: 'optional', on: '放量突破', res: 'where', doc: '放量突破回看前面有没有横盘' },
    '派发': { level: 'must_not', on: '回踩', res: 'negation', doc: '放量突破到回踩之间不能有派发' },
    '缩量': { level: 'excluded', why: '只在 1 个 buy 里有' },
    '放量': { level: 'must', attr: '放量突破', node: 'burst', clause: 'vol_spike' },
    '突破过好几个峰': { level: 'must', attr: '放量突破', node: 'burst', clause: 'distinct_pk' },
    '突破前沉寂够久': { level: 'excluded', attr: '放量突破', why: '只判断过 1 个框' },
  },
  // 两段之间的边（照 path2_apps/bb_v1/dag_spec.py 的 TemporalEdge：从 burst 的末根 bo 量起，tb 起点隔 1～20 根，且 tb 锚定的就是这根 bo）。
  // 正式版不在界面里复刻，直接调 app 自己的边逐对检查（path2/dag/diagnose.py 已有逐对检查）
  edges: [{ src: 'burst', dst: 'tb', min_gap: 1, max_gap: 20, from_last_child: 'members', anchor: 'anchor_bo_id' }],
  musts: ['放量突破', '回踩'],                       // 必须有，按 app 里的先后；偏离只按 must / must_not 算（flow v2 §0-6）
  where: { burst: ['vol_spike', 'distinct_pk'], tb: [] },
  // 页头一排事实（flow v2 §12-7）的演示值：会话写的问题文件、最近一次盲看用的版本、最后检查用了几次
  asks: [],                                        // 会话写的问题文件（mock 里在种子里手写）。题干、选项、回答都在会话里；工具只按题号显示每道题要看的图（#q=<id>，D1 2026-10-29）
  blind: 1, holdout: 0,
}
const PAPP = { [FAKE.pattern]: FAKE }              // pattern 名 → 当前实现它的 app
const UNSORTED = '未归类'
// 配色照搬主视图：node 本色来自 app 声明的 event_styles；进了 match 用本色，过了 where 深灰，只检测到浅灰；K 线绿涨红跌
const NODE_COLOR = SPEC.event_styles
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim()   // 配色只在 CSS 里定一处（朱红、会话蓝、app 琥珀、档位灰），主图照它画
const TIER_QUAL = cssVar('--tier-q'), TIER_DET = cssVar('--tier-d'), NEUTRAL = '#888888'
const UP = '#47b262', DOWN = '#eb5454'
const WHERE = {}
for (const n of SPEC.topology.nodes) WHERE[n.node_id] = n.where_rules.filter(r => !FAKE.where[n.node_id] || FAKE.where[n.node_id].includes(r.clause_id))
const APP_NODES = ['burst', 'tb']                 // view 模式的副图轨（bo 画在主图上，pk 不画）
const MONO = 'ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace'
const SANS = 'system-ui, sans-serif'

// 由 mapping 派生：名称 → node（能单独对照的），属性 → where
// res 是界面上「由谁来认」的唯一写法，用代码标识符；doc 是悬停内容。正式版都在运行时从 app 声明和类定义读，这里是照抄的示意
const MAP = {}, DMAP = {}
for (const [t, r] of Object.entries(FAKE.table)) if (r.res && r.res.startsWith('node:')) MAP[t] = r; else if (r.clause) DMAP[t] = r
const rowOf = t => FAKE.table[t] || null
// 一个词相对 app 的状态：mapped 已放进 / excluded 会话看过、没放（悬停写原因）/ unmapped 会话还没 map（critic Q8、flow v2 §5.4：只留两种「不在 app 里」）
const mapState = t => { const r = rowOf(t); return !r ? 'unmapped' : r.level === 'excluded' ? 'excluded' : 'mapped' }
// pattern p 用到的特征：p 的买点（所有图）成员框的特征名与属性。pattern 页的 unmapped 与图上的 unmapped 签都按这个范围
function patUsed(p) {
  const u = new Set()
  for (const st of STOCKS) for (const bp of annOf(st).buys) if (bp.pattern === p) for (const b of membersOf(bp, st)) {
    if (b.name) u.add(txt(b.name))
    for (const w of Object.keys(b.attrs)) u.add(txt(w))
  }
  return u
}
const MS_TIP = t => mapState(t) === 'excluded' ? `会话定了「${t}」不放：${rowOf(t).why}` : `会话还没 map「${t}」`
const LV_TIP = { optional: '有更好，不是必须', must_not: '有它就不买' }   // 级的悬停：pattern 页和选中框的 compare 签同一句
const NODE_TIP = t => `「${t}」map 到的 node：${rowOf(t).doc}`   // resolver 签 node:* 的悬停：pattern 页和选中框的 compare 节同一句
const RES_TIP = { where: '作为上一段的一条 where', child: '作为上一段的子事件', negation: '作为一条否定边' }
// 待验证的默认值
const DRAG_PX = 4       // 鼠标按下后移动超过它才算拖动画框，否则算点一下（选中）
const TOL = 2           // app 事件的起点或终点落在框外几天以内，仍算同一件事
const BUY_TOL = 3       // label=buy：app 买点在前后几天以内（或落在回踩事件里）算 app 也买
const NOBUY_TOL = 1     // label=no_buy：app 买点在前后几天以内算 app 买了
const CHANCE_WARN = 0.3 // 随手一框也被判 qualified 的比例超过它，就标 chance_high

// ── 状态（只在内存里） ──
const S = {
  stock: 0, mode: 'annotate', labels: true, tool: 'box', tab: 'selection', swallow: false, clock: 0, selAt: 0, live: null,
  q: null, merges: [], pendMerge: null,   // q：URL #q=<id> 打开的那道题（只显示它要看的图）
  cur: FAKE.pattern, patterns: [FAKE.pattern, UNSORTED],
  words: [], ann: {}, sel: null, drag: null, seq: 1, renaming: false, flags: [],
  ov: {}, pdef: {}, hover: null,   // ov：买点 → {框 → 进 / 出}，只记用户改过的；pdef：pattern 定义；flags：你点的 ⚑，每条 { pattern, feature, snap }
  lkOpen: null, pair: null,         // lkOpen：pattern 页展开缩略图的那个两段之间的签；pair：图上描出的两个框（从签跳来时）
}

// ── 数据整理 ──
const STOCKS = D.stocks.map(st => {
  const byId = {}
  const matchedIds = new Set()
  for (const m of st.analysis.matches) for (const id of Object.values(m.node_index)) matchedIds.add(id)
  const sys = []
  for (const e of st.analysis.events) {
    if (e.node_id === 'pk') continue
    const it = { id: e.instance_id, node: e.node_id, s: e.start_idx, e: e.end_idx, f: e, matched: matchedIds.has(e.instance_id) }
    sys.push(it); byId[it.id] = it
  }
  for (const e of st.analysis.events) if (e.node_id === 'burst' && matchedIds.has(e.instance_id))
    for (const b of (e.child_refs.members || [])) if (byId[b]) byId[b].matched = true
  for (const a of st.atoms) {
    const it = { id: a.instance_id, node: null, atom: a.kind, regime: a.regime, s: a.start_idx, e: a.end_idx, f: a,
                 label: a.kind === 'platform' ? 'platform' : a.regime }
    sys.push(it); byId[it.id] = it
  }
  // 假 app sbt_v1 的 match 直接借 bb_v1 跑出来的（两者 node 相同，sbt_v1 的 where 是 bb_v1 的子集）
  const matches = st.analysis.matches.map((m, i) => ({ no: i + 1, s: m.start_idx, e: m.end_idx, buy: byId[m.node_index.tb].s,
                                                      tb: byId[m.node_index.tb], nodes: m.node_index }))
  return { symbol: st.symbol, bars: st.bars, sys, byId, matches }
})
const ST = () => STOCKS[S.stock]
const annOf = st => (S.ann[st.symbol] ||= { boxes: [], buys: [] })
const A = () => annOf(ST())
const isApp = p => !!PAPP[p]
// mode 三档（用户 2026-10-28）：app = 只显示 app 跑出来的结果（轨按 node 分，不显示你的框、不能编辑）；annotate = 只显示你的框；
// compare = 你的框 + app 的结果叠画（照样能画框、改框、放买点）。原 view 改名 app，原 annotate 里的 compare 开关升成第三档。换图不退出 compare（U8）
const isAnn = () => S.mode === 'annotate' || S.mode === 'compare'   // 显示并能编辑你的框
const cmpOn = () => S.mode === 'compare' && isApp(S.cur)            // 当前 pattern 没有 app 时按 annotate 显示，切回有 app 的 pattern 自动恢复
const nid = p => p + (S.seq++)
const W = id => S.words.find(w => w.id === id)
const txt = id => (W(id) || {}).text || ''
// ⚑（map 方式不对）按「哪个 pattern 的 mapping 的哪一行」记，连同点的时候那一行的写法 snap；会话之后改了那一行就算 remapped，不再等会话（现算，用户 2026-10-30）
const rowSnap = (p, id) => JSON.stringify((PAPP[p] && PAPP[p].table[txt(id)]) || null)
const flagSt = f => rowSnap(f.pattern, f.feature) === f.snap ? 'open' : 'remapped'
const flagAt = (p, id) => S.flags.find(f => f.pattern === p && f.feature === id) || null
const snapTxt = sn => { const r = JSON.parse(sn); return r ? [r.level, r.on && `挂在「${r.on}」下`, r.res].filter(Boolean).join(' · ') : 'unmapped' }
const dateOf = (st, i) => st.bars[Math.max(0, Math.min(st.bars.length - 1, i))].date
const date = i => dateOf(ST(), i)
const span = (st, b) => dateOf(st, b.s) + (b.e > b.s ? ' → ' + dateOf(st, b.e) : '')
function wordOf(text) {             // 用户的词：有就用，没有就新建；同一份词表跨图、跨 pattern 共用
  let w = S.words.find(x => x.text === text)
  if (!w) { w = { id: nid('w'), text, def: '' }; S.words.push(w) }
  return w.id
}
const evalWhere = (node, se) => (WHERE[node] || []).map(r => {
  const v = se.f[r.field]
  const ok = v != null && ({ '>=': v >= r.threshold, '>': v > r.threshold, '<': v < r.threshold, '<=': v <= r.threshold })[r.op]
  return { id: r.clause_id, ok: !!ok }
})
const qualified = se => !se.node || evalWhere(se.node, se).every(r => r.ok)

// ── 属性的三种状态：true / false / null（null = 标这个框时这条属性还不存在） ──
function attrsOf(nameId) {          // 所有图上、同名的框用过的属性（按首次出现顺序）
  const out = []
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId)
    for (const w of Object.keys(b.attrs)) if (!out.includes(w)) out.push(w)
  return out
}
const attrState = (b, w) => b.attrs[w] === true ? 'true' : b.attrs[w] === false ? 'false' : 'null'
function kidWordsOf(nameId) {        // 在这个名称的框里画成过子框的词（所有图）
  const out = []
  for (const st of STOCKS) { const a = annOf(st); for (const c of a.boxes) { const p = parentOf(c, a); if (p && p.name === nameId && c.name && !out.includes(c.name)) out.push(c.name) } }
  return out
}
function setName(b, id) {           // 选了特征，以前和它一起用过的属性都列出来，一律算没看过（null）：D2 用户 2026-10-28 定，carry 对比开关已删
  b.name = id
}
// 框 o 包住框 b：b 完全落在 o 里，且 o 更长。不带容差：首尾交叠的两段一律按先后读（sim 第三轮 L1：容差把随手画的回踩和放量突破判成父子，
// 名称级从属一翻，整个 pattern 的轨标题和轨序都倒过来；critic 撤回 Q6）。想表达属于而边画出去了，在子框 edit 栏点上 ⊂（attach）
function contains(o, b) {
  return o !== b && (o.e - o.s) > (b.e - b.s) && b.s >= o.s && b.e <= o.e
}
const overlaps = (o, b) => o !== b && (o.e - o.s) > (b.e - b.s) && b.s <= o.e && b.e >= o.s   // 有交叠、外框更长：可以手动点上 ⊂ 的候选
function parentOf(b, a) {           // 框套框：时间上被另一个框包住，默认算属于它；用户点掉「⊂」（detach）的不算；用户点上的（attach）算
  if (b.detach) return null
  if (b.attach) { const o = a.boxes.find(x => x.id === b.attach); if (o) return o }
  let p = null
  for (const o of a.boxes) if (contains(o, b))
    if (!p || (o.e - o.s) < (p.e - p.s)) p = o
  return p
}

// ── 一个买点由哪几个框构成（成员）：默认规则 + 用户改过的那几个框；范围由成员派生，不单独存 ──
const GAP = 20          // 待验证：从买点往前，前后两段之间空几根 K 线以内仍算连着（买点到第一个框、框到框用同一个数）
function autoMembers(bp, st) {
  const bs = annOf(st).boxes.filter(b => b.s <= bp.idx)          // 买点之后才开始的框不可能是买入理由
  const mem = new Set()
  let edge = bp.idx, changed = true
  while (changed) {
    changed = false
    for (const b of bs) if (!mem.has(b) && b.e >= edge - GAP) { mem.add(b); changed = true }   // 落在这串跨度里的框也算接上（原先漏了 b.s > edge 的这类）
    if (mem.size) edge = Math.min(...[...mem].map(b => b.s))
  }
  for (const b of bs) if (!mem.has(b) && [...mem].some(m => contains(m, b) || b.attach === m.id)) mem.add(b)   // 被成员包住的跟着进；detach 只管「属不属于外框」，不管是不是成员
  return mem
}
// 默认成员跟着「选中的买点」走（flow v2 §6 P5）：新放的买点按默认规则推断；以后每次被选中（放下即选中、从缩略图跳来也选中），
// 选中期间新画的框按默认规则并进、bracket 当面伸长；没选中时用冻结的那份，以后补画的框不会悄悄进旧买点。只加不踢；用户点过的进 / 出一直算数
const isSelBuy = bp => S.live === bp.id      // 当前买点（见 render）
function membersOf(bp, st, live = isSelBuy(bp)) {
  const bs = annOf(st).boxes
  const m = new Set(bp.frozen ? bs.filter(b => bp.frozen.includes(b.id)) : [])
  if (!bp.frozen) for (const b of autoMembers(bp, st)) m.add(b)
  else if (live) for (const b of autoMembers(bp, st)) if (b.t > S.selAt) m.add(b)

    let to = e.target.value
    if (!to) return
    if (to === '__new') { to = prompt('pattern name'); if (!to) return; if (!S.patterns.includes(to)) S.patterns.push(to) }
    for (const bp of GRP[v] || []) bp.pattern = to   // 组号 → 这组的买点（本次渲染时记下）
    // 只改归属、不切页：留在当前 pattern，挪走的组从这一页消失；看别的 pattern 用顶栏的 pattern 下拉
  } else if (k === 'wmerge') {                      // 选了目标词先预览「n 个框：A → B」，点 merge 才改（sim 第三轮 L3）；改完还能拆回（critic L3）
    const to = e.target.value; if (!to) return
    S.pendMerge = { from: v, to }
  } else if (k === 'pdef') S.pdef[S.cur] = e.target.value
  else if (k === 'wdef') W(v).def = e.target.value
  else if (k === 'bnote' && b) { b.note = e.target.value }
  else if (k === 'pnote' && bp) { bp.note = e.target.value }
  else if (k === 'bpat' && bp) { bp.pattern = e.target.value }
  else return
  render()
})
document.addEventListener('input', e => {        // 起新词时，和输入有共同字（词或定义里）的已有词排到最前、加框：先看看是不是已经有这个词（引导，flow v2 R1）
  if (e.target.tagName === 'TEXTAREA') return fitArea(e.target)   // 定义边打边长高
  if (e.target.id !== 'newname') return
  const q = [...new Set(e.target.value.trim())]
  for (const b of document.querySelectorAll('#side [data-act^="name:"]')) {
    const w = W(b.getAttribute('data-act').slice(5)), hay = w.text + (w.def || ''), n = q.filter(c => hay.includes(c)).length
    b.style.order = n ? String(-n) : '0'; b.classList.toggle('near', n > 0)
    if (b.getAttribute('data-ao')) b.style.display = n ? '' : 'none'
  }
})
document.addEventListener('keydown', e => {      // 新词、新属性输入框按回车 = 点旁边的 +（sim F17）
  if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA') { e.preventDefault(); e.target.blur(); return }   // 定义只写一句：回车 = 写完，失焦时 change 存下
  if (e.key !== 'Enter' || !['newname', 'newattr'].includes(e.target.id)) return
  const b = e.target.parentElement.querySelector('[data-act]'); if (b) b.click()
})
window.addEventListener('resize', () => { fitWrap(); draw() })
window.addEventListener('hashchange', () => { openQ(hashQ()); render() })   // 从会话里点另一道题的链接：同一个页面换 hash
openQ(hashQ())
render()
</script>
</body>
