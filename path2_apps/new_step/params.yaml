# new_step 的参数。全部待验证:初值从用户正样本量出、留余量;由反馈推出的按用户原话字面取。

plateau:
  # ---- 识别器(切段)----
  old_window: 15        # 旧平台固定取阶跃前多少根;也是开段时回看波动的窗
  strong_k: 3.0         # 单根涨幅超过旧平台波动的这个倍数就开段 / 并入阶跃
  max_step_bars: 5      # 一段阶跃最多几根
  max_days: 40          # 阶跃之后最多看多少天
  overhead_window: 60   # 前高压力:从当天往前约三个月找阶跃前的前高
  calm_window: 10       # 波动小:只看新平台最近多少天
  # ---- 条件(where)----
  old_flat_max: 1.2     # 旧平台平:旧平台振幅不超过阶跃高度的这个倍数
  step_rise_min: 0.4    # 大涨幅:阶跃累计涨幅(收益率)至少是这个值
  vs_left_min: 4.0      # 阶跃比左侧强:最大单根涨幅至少是旧平台波动的这个倍数
  vs_right_min: 2.5     # 阶跃比右侧强:最大单根涨幅至少是新平台波动的这个倍数
  step_vol_min: 3.0     # 平台交界放量:阶跃里最大成交量至少是旧平台平均量的这个倍数
  keep_min: 0.3         # 新平台守住:当天收盘至少守住阶跃高度的这个比例
  calm_max: 0.6         # 波动小:新平台最近一段的振幅不超过阶跃高度的这个倍数
  vs_high_max: 1.0      # 没追涨:当天收盘低于阶跃以来的最高价
  body_min: 0.0         # 收阳:当天收盘高于开盘
  overhead_max: 1.0     # 前高压力:阶跃前近期的前高不高过当天收盘
  shrink_max: 0.75      # 新平台缩量:新平台平均量不超过阶跃平均量的这个倍数
  settle_bars: 1        # 企稳:当天不创新平台以来的收盘新低(正样本 KULR 2024-04-01 前一天刚创新低)
  big_rise: 3.0         # 涨幅过大:阶跃累计涨幅达到这个值算特别猛
  big_wait: 5           # 涨幅过大:特别猛的阶跃之后至少站这么多天才买

edges: {}
