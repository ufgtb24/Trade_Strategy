# new_step 的参数。全部待验证:初值从用户 10 个正样本(CRNC、GEVO、INDO、QBTS、RGTI、SMX)量出、留余量。

plateau:
  # ---- 识别器(切段)----
  old_window: 15        # 旧平台固定取阶跃前多少根;也是开段时回看波动的窗
  strong_k: 3.0         # 单根涨幅超过旧平台波动的这个倍数就开段 / 并入阶跃
  max_step_bars: 5      # 一段阶跃最多几根
  max_days: 40          # 阶跃之后最多看多少天
  # ---- 条件(where)----
  old_flat_max: 1.2     # 旧平台平:旧平台振幅不超过阶跃高度的这个倍数
  step_rise_min: 0.4    # 大涨幅:阶跃累计涨幅(收益率)至少是这个值
  vs_left_min: 4.0      # 阶跃比左侧强:最大单根涨幅至少是旧平台波动的这个倍数
  vs_right_min: 2.5     # 阶跃比右侧强:最大单根涨幅至少是新平台波动的这个倍数
  step_vol_min: 3.0     # 平台交界放量:阶跃里最大成交量至少是旧平台平均量的这个倍数
  keep_min: 0.3         # 新平台守住:新平台(连同当天)最低收盘至少守住阶跃高度的这个比例
  calm_max: 0.6         # 波动小:新平台振幅不超过阶跃高度的这个倍数
  vs_high_max: 1.0      # 没追涨:当天收盘低于阶跃以来的最高价
  body_min: 0.0         # 收阳:当天收盘高于开盘

edges: {}
