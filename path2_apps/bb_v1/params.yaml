# Default params for bb_v1 pattern (V1 throwback 完整备份;内容=tune 分支 p2.yaml)。
bo:
  total_window: 20
  min_side_bars: 6
  min_relative_height: 0.2
  exceed_threshold: 0.0075   # 2026-09-08 tune-gates 定案(原 0.003):要求更强的突破。全宇宙
                             # 2024/2025 两年首次穿越率各 +1.6/+2.8 点,买点数只掉 8%
  peak_supersede_threshold: 0.01
  vol_baseline_period: 63
  peak_measure: high
  breakout_measure: close
burst:
  gap_max: 8
  vol_baseline_period: 63
  min_bos: 1
  first_drought_min: 40
  distinct_pk_min: 3
  vol_spike_min: 3
  peak_age_min: 0         # 2026-09-08 tune-gates 定案(原 60):置 0 = 该 where 恒真 = 停用。
                          # 实测这道闸是负增量——放开后买点 +13%,2024/2025 首次穿越率
                          # 反而各 +0.6/+1.3 点,即它删掉的样本比留下的更好。留字段不删
                          # 结构,想恢复改回阈值即可
tb:
  max_rise_k: 1.5         # 反弹/脱离阈值(median TR 倍数)
  stop_confirm_bars: 1    # K 根不刷新入段
  vol_window: 14          # median TR 滚动窗(即时取 i-1)
  max_span: 20            # 全局预算 [bo+1, bo+max_span];edge max_gap 同值(SSoT)。2026-09-08
                          # tune-gates 已验证(此前是待拍板的占位值):20/30/50 三档几乎无差别
                          # (买点只多 21 个、两年穿越率 ±0.5 点内),10 明显更差,故定 20
  measure: close          # 全部数值比较口径;阴线臂恒 close/open
  max_day_drop_pct: 0.2   # 资格型 where 阈值(2026-08-18 定案):回踩段单日跌幅≥此值→tb where 拦;null=不加该 where

# edges 段:当前所有 edge 字段或硬编码(min_gap=1/anchor_field/Child(...))或从 node
# section 引用(max_gap = tb.max_span),故本段当前为空。保留 section 占位以便未来
# 扩展 edge-only 参数(如某新边的 max_lag)。
edges: {}
