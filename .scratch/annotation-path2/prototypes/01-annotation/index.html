<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>结构化标注原型</title>
<!-- PROTOTYPE v2，用完即扔：回答「结构化标注存什么、界面和主视图怎么合、标完怎么对照 app」。
     按 2026-10-25 用户拍板的方向重写：标注时只看干净 K 线、不能点选系统事件；名称和属性用用户自己的词、存成可复用词表；
     角色不手填；对照不给数字、同轨叠画；对照开关换图自动关；汇总页按名称列对应表、新老分开。
     文字分两类（2026-10-26 用户定）：用户输入 / 会话输出用自然语言（无衬线、深色）；程序固定内容用标识符（等宽、灰色），尽量压缩。
     数据来自 scripts/01-dump-proto-data.py（只读截到 2025-12-31 的副本）。状态只在内存里，刷新即丢。 -->
<style>
  * { box-sizing: border-box; }
  :root { --bizbg: #e9e9ec; --biz: #0f172a; --sym: #52525b; --line: #e4e4e7; --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; color: var(--biz); background: #fff; }
  .sym { font-family: var(--mono); font-size: 11.5px; color: var(--sym); }
  .biz { font-family: system-ui, sans-serif; color: var(--biz); }
  .biz:not(input) { background: var(--bizbg); padding: 0 4px; border-radius: 3px; }   /* 输入框外的自然语言：浅灰底 */
  #top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 10px;
         border-bottom: 1px solid #d4d4d8; background: #fafafa; }
  #top .grp { display: flex; gap: 4px; align-items: center; }
  #top .ttl { font-weight: 700; }
  .tag { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border: 1px solid #71717a; border-radius: 3px; color: #3f3f46; white-space: nowrap; }
  .tag.dash { border-style: dashed; }
  .tag.on { background: #111; color: #fff; border-color: #111; }
  button { font: inherit; padding: 1px 7px; border: 1px solid #a1a1aa; background: #fff; border-radius: 3px; cursor: pointer; }
  button.s { font-family: var(--mono); font-size: 11.5px; }
  button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
  button:disabled { opacity: .4; cursor: default; }
  select, input[type=text] { font: inherit; padding: 1px 4px; border: 1px solid #a1a1aa; border-radius: 3px; }
  input::placeholder { font-family: var(--mono); font-size: 11px; color: #a1a1aa; }
  #wrap { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 40px); }
  #chartcol { overflow: auto; padding: 4px 0 0 0; }
  #side { border-left: 1px solid #d4d4d8; overflow: auto; padding: 0 10px 40px; }
  #tabs { position: sticky; top: 0; z-index: 1; background: #fff; display: flex; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hdr { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .hdr .grow { flex: 1; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 4px 8px; align-items: center; }
  .kv > .k { font-family: var(--mono); font-size: 11.5px; color: var(--sym); }
  .kv input[type=text] { width: 100%; }
  .row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid var(--line); padding: 2px 4px; vertical-align: top; text-align: left; }
  th { font-family: var(--mono); font-size: 11px; color: var(--sym); font-weight: 400; }
  td.sub { padding-left: 14px; }
  td:first-child, th:first-child, th { white-space: nowrap; }
  .card { border: 1px solid #d4d4d8; border-radius: 4px; padding: 5px 7px; margin: 6px 0; }
  .fail { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #111; }
  #side pre { background: #f4f4f5; padding: 6px; font-size: 11px; max-height: 640px; overflow: auto; white-space: pre-wrap; }
  svg text { user-select: none; }
</style>
</head>
<body>
<div id="top"></div>
<div id="wrap"><div id="chartcol"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div><aside id="side"></aside></div>
<script src="data.js"></script>
<script>
'use strict'
const D = window.PROTO_DATA
const SPEC = D.pattern_spec
const APP = SPEC.pattern_id                       // bb_v1
// 配色照搬主视图：node 本色来自 app 声明的 event_styles；进了 match 用本色，过了 where 深灰，只检测到浅灰；K 线绿涨红跌
const NODE_COLOR = SPEC.event_styles
const TIER_QUAL = '#9ca3af', TIER_DET = '#d1d5db', NEUTRAL = '#888888'
const UP = '#47b262', DOWN = '#eb5454'
const WHERE = {}
for (const n of SPEC.topology.nodes) WHERE[n.node_id] = n.where_rules
const APP_NODES = ['burst', 'tb']                 // view 模式的副图轨（bo 画在主图上，pk 不画）
const MONO = 'ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace'
const SANS = 'system-ui, sans-serif'

// 对应表：真实流程里由会话在标完后按跨图证据写；原型里预先写好一份示意，按词的字面对
const MAP = {                                     // 名称 → app 里由谁来认
  '放量突破': { res: 'node:burst', node: 'burst' },
  '回踩': { res: 'node:tb', node: 'tb' },
  '横盘': { res: 'atom:trend[sideways]', atom: 'trend', regime: 'sideways' },
  '平台': { res: 'atom:platform', atom: 'platform' },
}
const DMAP = {                                    // 属性 → where
  '放量': { node: 'burst', clause: 'vol_spike' },
  '突破过好几个峰': { node: 'burst', clause: 'distinct_pk' },
  '突破前沉寂够久': { node: 'burst', clause: 'first_drought' },
  '回踩里没有大跌': { node: 'tb', clause: 'day_drop' },
}
// 待验证的默认值
const TOL = 2           // app 事件的起点或终点落在框外几天以内，仍算同一件事
const BUY_TOL = 3       // label=buy：app 买点在前后几天以内（或落在回踩事件里）算 app 也买
const NOBUY_TOL = 1     // label=no_buy：app 买点在前后几天以内算 app 买了
const CHANCE_WARN = 0.3 // 随手一框也被判 qualified 的比例超过它，就标 chance_high
const NEW_MIN = 5       // 新标注不足几个框，标 n<5

// ── 状态（只在内存里） ──
const S = {
  stock: 0, mode: 'annotate', cmp: false, tool: 'select', tab: 'edit',
  cur: APP, patterns: [APP, '未归类'],
  words: [], ann: {}, sel: null, drag: null, seq: 1, renaming: false, flags: [],
}

// ── 数据整理 ──
const STOCKS = D.stocks.map(st => {
  const byId = {}
  const matchedIds = new Set()
  for (const m of st.analysis.matches) for (const id of Object.values(m.node_index)) matchedIds.add(id)
  const sys = []
  for (const e of st.analysis.events) {
    if (e.node_id === 'pk') continue
    const it = { id: e.instance_id, node: e.node_id, s: e.start_idx, e: e.end_idx, f: e, matched: matchedIds.has(e.instance_id) }
    sys.push(it); byId[it.id] = it
  }
  for (const e of st.analysis.events) if (e.node_id === 'burst' && matchedIds.has(e.instance_id))
    for (const b of (e.child_refs.members || [])) if (byId[b]) byId[b].matched = true
  for (const a of st.atoms) {
    const it = { id: a.instance_id, node: null, atom: a.kind, regime: a.regime, s: a.start_idx, e: a.end_idx, f: a,
                 label: a.kind === 'platform' ? 'platform' : a.regime }
    sys.push(it); byId[it.id] = it
  }
  const matches = st.analysis.matches.map((m, i) => ({ no: i + 1, s: m.start_idx, e: m.end_idx, buy: byId[m.node_index.tb].s,
                                                      tb: byId[m.node_index.tb], nodes: m.node_index }))
  return { symbol: st.symbol, bars: st.bars, sys, byId, matches }
})
const ST = () => STOCKS[S.stock]
const annOf = st => (S.ann[st.symbol] ||= { boxes: [], buys: [], touched: false, sawApp: false })
const A = () => annOf(ST())
const isApp = p => p === APP
const nid = p => p + (S.seq++)
const W = id => S.words.find(w => w.id === id)
const txt = id => (W(id) || {}).text || ''
const dateOf = (st, i) => st.bars[Math.max(0, Math.min(st.bars.length - 1, i))].date
const date = i => dateOf(ST(), i)
const span = (st, b) => dateOf(st, b.s) + (b.e > b.s ? ' → ' + dateOf(st, b.e) : '')
function wordOf(text) {             // 用户的词：有就用，没有就新建；同一份词表跨图、跨 pattern 共用
  let w = S.words.find(x => x.text === text)
  if (!w) { w = { id: nid('w'), text, def: '' }; S.words.push(w) }
  return w.id
}
const evalWhere = (node, se) => (WHERE[node] || []).map(r => {
  const v = se.f[r.field]
  const ok = v != null && ({ '>=': v >= r.threshold, '>': v > r.threshold, '<': v < r.threshold, '<=': v <= r.threshold })[r.op]
  return { id: r.clause_id, ok: !!ok }
})
const qualified = se => !se.node || evalWhere(se.node, se).every(r => r.ok)
function markEdit() { const a = A(); if (a.sawApp) a.touched = true }   // touched_app 由界面顺手记

// ── 属性的三种状态：true / false / null（null = 标这个框时这条属性还不存在） ──
function attrsOf(nameId) {          // 所有图上、同名的框用过的属性（按首次出现顺序）
  const out = []
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId)
    for (const w of Object.keys(b.attrs)) if (!out.includes(w)) out.push(w)
  return out
}
const attrState = (b, w) => b.attrs[w] === true ? 'true' : b.attrs[w] === false ? 'false' : 'null'
function setName(b, id) {           // 选了名称，以前和它一起用过的属性默认全为 true
  b.name = id
  for (const w of attrsOf(id)) if (!(w in b.attrs)) b.attrs[w] = true
}
function parentOf(b, a) {           // 框套框：时间上被另一个框包住，默认算属于它
  let p = null
  for (const o of a.boxes) if (o !== b && o.s <= b.s && o.e >= b.e && (o.e - o.s) > (b.e - b.s))
    if (!p || (o.e - o.s) < (p.e - p.s)) p = o
  return p
}

// ── 对照：框 qualified / detected / missing，买点 app=buy / no_buy，两框之间 link，不出数字 ──
function candidates(b, st) {
  const m = MAP[txt(b.name)]
  if (!m) return null
  const near = x => x >= b.s - TOL && x <= b.e + TOL
  return st.sys.filter(se => (m.node ? se.node === m.node : se.atom === m.atom && (!m.regime || se.regime === m.regime))
                             && se.e >= b.s - TOL && se.s <= b.e + TOL && (near(se.s) || near(se.e)))
}
function verdict(b, st) {
  if (b.letGo) return { st: 'let_go', checks: [], flags: [] }
  const c = candidates(b, st)
  if (!c) return { st: 'unmapped', checks: [], flags: [] }
  const m = MAP[txt(b.name)]
  const flags = m.atom ? ['default_params'] : []
  if (!c.length) return { st: 'missing', res: m.res, checks: [], flags }
  const ov = x => Math.min(x.e, b.e) - Math.max(x.s, b.s)
  const better = (x, p) => x.matched !== p.matched ? x.matched : ov(x) > ov(p)   // 进了 match 的优先，其次交叠多的
  const pick = arr => arr.reduce((p, x) => better(x, p) ? x : p)
  const q = c.filter(qualified)
  const ev = q.length ? pick(q) : pick(c)
  const checks = []                 // 每条：属性（或无对应属性的 where）、用户怎么标、app 过没过
  for (const r of (ev.node ? evalWhere(ev.node, ev) : [])) {
    const w = S.words.find(x => DMAP[x.text] && DMAP[x.text].node === ev.node && DMAP[x.text].clause === r.id)
    const user = w ? (w.id in b.attrs || attrsOf(b.name).includes(w.id) ? attrState(b, w.id) : '—') : '—'
    const app = r.ok ? 'pass' : 'fail'
    if (r.ok && user !== 'false') continue   // 只列对不上的：app 没过，或用户说 false 而 app 说 pass
    checks.push({ attr: w ? w.text : null, clause: r.id, user, app })
  }
  for (const w of Object.keys(b.attrs)) if (b.attrs[w] && !DMAP[txt(w)]) checks.push({ attr: txt(w), clause: null, user: 'true', app: 'n/a' })
  return { st: q.length ? 'qualified' : 'detected', res: m.res, checks, flags }
}
function buyVerdict(bp, st) {
  if (!isApp(bp.pattern)) return { app: 'n/a', link: '—', pending: [] }
  if (bp.label === 'no_buy') {
    const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= NOBUY_TOL)
    return { app: m ? 'buy' : 'no_buy', link: '—', pending: [] }
  }
  const m = st.matches.find(x => Math.abs(x.buy - bp.idx) <= BUY_TOL || (bp.idx >= x.tb.s && bp.idx <= x.tb.e))
  const before = annOf(st).boxes.filter(b => b.s <= bp.idx + TOL && b.e >= bp.idx - 40 && MAP[txt(b.name)] && MAP[txt(b.name)].node)
  const pending = before.filter(b => !['qualified', 'let_go'].includes(verdict(b, st).st)).map(b => txt(b.name))
  const link = !before.length ? '—' : pending.length ? 'pending' : m ? 'ok' : 'broken'
  return { app: m ? 'buy' : 'no_buy', link, pending }
}
function seeded(seed) { let r = seed % 2147483646 + 1; return () => (r = (r * 16807) % 2147483647) / 2147483647 }
function chanceOf(nameId) {         // 底：同样宽的框随便挪个位置，被判 qualified 的比例
  let hit = 0, tot = 0
  for (const st of STOCKS) for (const b of annOf(st).boxes) if (b.name === nameId && !b.letGo && MAP[txt(nameId)]) {
    const w = b.e - b.s, N = st.bars.length, rnd = seeded(b.s * 7919 + b.e + 1)
    for (let k = 0; k < 40; k++) {
      const s = Math.floor(rnd() * Math.max(1, N - w))
      tot++
      if (verdict({ ...b, s, e: s + w, letGo: false }, st).st === 'qualified') hit++
    }
  }
  return tot ? hit / tot : 0
}

// ── 示例标注：两只股票，演示「选名称带上属性」「后加的属性在旧框上是 null」「框套框」「对照」 ──
;(function seed() {
  const mk = (st, name, s, e, attrs = {}) => {
    const b = { id: nid('b'), name: wordOf(name), s, e, attrs: {}, note: '', letGo: false }
    for (const [k, v] of Object.entries(attrs)) b.attrs[wordOf(k)] = v
    annOf(st).boxes.push(b); return b
  }
  const buy = (st, idx, label, note = '') => annOf(st).buys.push({ id: nid('p'), idx, pattern: APP, label, note })
  const [s0, s1] = STOCKS
  mk(s0, '横盘', 135, 158)
  mk(s0, '缩量', 140, 146)
  W(wordOf('横盘')).def = '突破前价格窄幅横着走一段'
  mk(s0, '放量突破', 159, 164, { 放量: true, 突破过好几个峰: true })
  W(wordOf('放量突破')).def = '放量越过前面好几个峰'
  mk(s0, '回踩', 164, 167)
  buy(s0, 167, 'buy')
  mk(s0, '放量突破', 80, 82, { 放量: true, 突破过好几个峰: true })
  buy(s0, 84, 'buy')
  buy(s0, 175, 'no_buy', '回踩前一天放量长阴，当天就看得见')
  // 第二张图上才想到「突破前沉寂够久」：第一张图上的同名框，这条属性就是 null
  mk(s1, '横盘', 98, 106)
  mk(s1, '放量突破', 159, 165, { 放量: true, 突破过好几个峰: false, 突破前沉寂够久: true })
  mk(s1, '回踩', 165, 167)
  buy(s1, 166, 'buy')
  annOf(s1).touched = true          // 演示：这张图开过对照后又改了标注，算老标注
  annOf(s1).sawApp = true
})()

// ── 画图 ──
const NS = 'http://www.w3.org/2000/svg'
const LW = 118, MAIN_H = 380, ROW_H = 30, BR_H = 26
let G = {}
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag)
  for (const k in attrs) e.setAttribute(k, attrs[k])
  if (text != null) e.textContent = text
  ;(parent || G.svg).appendChild(e)
  return e
}
const symText = (x, y, t, extra = {}) => el('text', { x, y, 'font-size': 10.5, 'font-family': MONO, fill: '#52525b', ...extra }, null, t)
function lanes() {
  if (S.mode === 'view') return APP_NODES.map(n => ({ key: 'n:' + n, label: n, biz: false, node: n }))
  const used = new Set(A().boxes.map(b => b.name))
  const R = S.words.filter(w => used.has(w.id)).map(w => ({ key: w.id, label: w.text, biz: true }))
  if (used.has(null)) R.push({ key: null, label: 'unnamed', biz: false })
  return R
}
function sysOfLane(r) {
  const st = ST()
  if (S.mode === 'view') return st.sys.filter(se => se.node === r.node)
  if (!S.cmp || r.key == null) return []
  const m = MAP[txt(r.key)]
  if (!m) return []
  return st.sys.filter(se => m.node ? se.node === m.node : se.atom === m.atom && (!m.regime || se.regime === m.regime))
}
function colorOfSys(se) {
  if (!se.node) return NEUTRAL                      // 当前 app 之外的 detector（平台段、走势区段）
  if (se.matched) return NODE_COLOR[se.node] || NEUTRAL
  return qualified(se) ? TIER_QUAL : TIER_DET
}
const sel = (type, id) => S.sel && S.sel.type === type && S.sel.id === id
const showApp = () => S.mode === 'view' || S.cmp
function draw() {
  const svg = document.getElementById('chart')
  svg.innerHTML = ''
  const st = ST(), N = st.bars.length, a = A()
  const Wd = Math.max(900, document.getElementById('chartcol').clientWidth - 6)
  const step = (Wd - LW - 10) / N
  const X = i => LW + (i + 0.5) * step, X0 = i => LW + i * step
  const R = lanes()
  const H = MAIN_H + 14 + (showApp() ? BR_H : 0) + R.length * ROW_H + 30
  svg.setAttribute('width', Wd); svg.setAttribute('height', H)
  G = { svg, step, X, X0, N, rowsY: [] }

  // 主图
  let lo = Infinity, hi = -Infinity
  for (const b of st.bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h) }
  const pad = (hi - lo) * 0.08; lo -= pad * 1.6; hi += pad
  const Y = p => 8 + (hi - p) / (hi - lo) * (MAIN_H - 16)
  el('rect', { x: LW, y: 4, width: Wd - LW - 10, height: MAIN_H - 4, fill: '#fff', stroke: '#e4e4e7' })
  el('text', { x: 8, y: 20, 'font-size': 13, 'font-weight': 700, 'font-family': SANS }, null, st.symbol)
  symText(8, 36, 'main')
  if (a.touched && S.mode === 'annotate') symText(8, 52, 'touched_app')
  const cw = Math.max(1.5, step * 0.62)
  st.bars.forEach((b, i) => {
    const up = b.c >= b.o
    el('line', { x1: X(i), x2: X(i), y1: Y(b.h), y2: Y(b.l), stroke: up ? UP : DOWN, 'stroke-width': 1, 'pointer-events': 'none' })
    el('rect', { x: X(i) - cw / 2, y: Y(Math.max(b.o, b.c)), width: cw, height: Math.max(1, Math.abs(Y(b.o) - Y(b.c))),
                 fill: up ? UP : DOWN, stroke: up ? UP : DOWN, 'stroke-width': 0.8, 'pointer-events': 'none' })
  })
  if (S.mode === 'view') for (const se of st.sys) if (se.node === 'bo') {      // view 模式：主图上的突破
    const x = X(se.s), yy = Y(st.bars[se.s].h) - 6
    el('path', { d: `M${x} ${yy - 7} L${x - 5} ${yy} L${x + 5} ${yy} Z`, fill: colorOfSys(se) })
  }
  if (S.mode === 'annotate') for (const bp of a.buys) {                         // 用户的买点：实心 buy，空心 no_buy
    const x = X(bp.idx), yy = Y(st.bars[bp.idx].l) + 6, pos = bp.label === 'buy', s = sel('buy', bp.id)
    el('path', { d: `M${x} ${yy} L${x - 7} ${yy + 12} L${x + 7} ${yy + 12} Z`, fill: pos ? '#111' : '#fff', stroke: '#111',
                 'stroke-width': s ? 3 : 1.5, 'data-buy': bp.id, cursor: 'pointer' })
    symText(x, yy + 25, bp.label + (bp.pattern === S.cur ? '' : '@' + bp.pattern),
            { 'text-anchor': 'middle', fill: '#111', 'data-buy': bp.id, cursor: 'pointer' })
    if (S.cmp && bp.pattern === S.cur) {
      const v = buyVerdict(bp, st)
      badge(x - 30, yy + 30, 'app:' + v.app, v.app !== bp.label)
    }
    if (s) el('line', { x1: x, x2: x, y1: 4, y2: H - 30, stroke: '#111', 'stroke-dasharray': '2 3', 'pointer-events': 'none' })
  }

  let yy = MAIN_H + 14
  if (showApp()) {                                                            // bracket 轨：app 的 match
    symText(8, yy + 15, 'bracket')

  const bp = S.sel && S.sel.type === 'buy' ? a.buys.find(x => x.id === S.sel.id) : null
  if (k === 'cur') {
    if (e.target.value === '__new') { const n = prompt('pattern name'); if (n && !S.patterns.includes(n)) S.patterns.push(n); if (n) S.cur = n }
    else S.cur = e.target.value
    if (!isApp(S.cur)) S.cmp = false
  } else if (k === 'wdef') W(v).def = e.target.value
  else if (k === 'bnote' && b) { b.note = e.target.value; markEdit() }
  else if (k === 'pnote' && bp) { bp.note = e.target.value; markEdit() }
  else if (k === 'bpat' && bp) { bp.pattern = e.target.value; markEdit() }
  else return
  render()
})
window.addEventListener('resize', draw)
render()
</script>
</body>
